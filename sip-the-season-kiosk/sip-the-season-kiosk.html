<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Sip The Season</title>
<style>
/* ============================================================
   SIP THE SEASON — BIA store kiosk
   Placeholder-asset build. See BUILD_NOTES.md alongside this
   file for exactly what is spec-final vs. placeholder.
   ============================================================ */

:root{
  /* ---- core palette (design-system MASTER §2 — LOCKED, do not swap) ---- */
  --wine-900:#3a0e26;
  --wine-800:#4a1030;
  --wine-700:#541232;
  --gold-600:#cb951a;
  --gold-400:#e0b04a;
  --cream-050:#f8f2e2;
  --cream-100:#fbf6ea;
  --green-600:#27813a;
  --green-500:#2e9d40;
  --pink-300:#e6afcb;
  --navy-500:#2f5d8a;
  --ink:#2a1018;

  /* ---- derived tones (mixed from the locked palette, not new hues) ----
     A deeper wine for vignette edges + true depth, and a 4-stop gold
     ramp so gilded type/edges read as pressed foil rather than flat
     paint. All sit on the wine→gold→cream axis the MASTER defines. */
  --wine-950:#2a0a1c;
  --wine-black:#1c0512;
  --gold-300:#f0d08a;
  --gold-700:#a1730f;
  --gold-800:#7a5408;
  --cream-000:#fffdf7;
  --cocoa:#6b5560;                 /* muted label text on cream */
  --cocoa-deep:#7a5f52;

  /* hairlines — the gilt line that frames cards, rules, medallions */
  --gilt:rgba(203,149,26,0.55);
  --gilt-soft:rgba(203,149,26,0.30);
  --gilt-faint:rgba(203,149,26,0.16);
  --gilt-on-cream:rgba(84,18,50,0.14);

  /* gold "foil" — clipped behind display type + key strokes */
  --foil:linear-gradient(176deg, var(--gold-300) 0%, var(--gold-400) 34%, var(--gold-600) 63%, var(--gold-700) 100%);
  --foil-soft:linear-gradient(180deg, var(--gold-400), var(--gold-600));

  --radius-lg:1.4rem;
  --radius-md:1rem;
  --radius-sm:0.6rem;

  /* Warm, layered elevation — tinted to the wine ground (never neutral
     black). Three stacked casts read as lifted paper on a dark table. */
  --shadow-soft:
    0 0.1rem 0.2rem rgba(20,4,12,0.18),
    0 0.55rem 1.3rem rgba(20,4,12,0.26),
    0 1.6rem 3.4rem rgba(20,4,12,0.20);
  --shadow-lift:
    0 0.2rem 0.5rem rgba(20,4,12,0.24),
    0 1.1rem 2.4rem rgba(20,4,12,0.32),
    0 2.8rem 5.4rem rgba(20,4,12,0.26);
  /* the top sheen + gilt inset that turns a flat cream rectangle into
     a bordered card of stock */
  --edge-cream:
    inset 0 0.06rem 0 rgba(255,255,255,0.75),
    inset 0 0 0 0.06rem var(--gilt-faint);

  /* spacing scale — design-system/sip-the-season/MASTER.md §4 (Spacious).
     --space-sm is also the minimum gap between two touch targets. */
  --space-xs:0.25rem;
  --space-sm:0.5rem;
  --space-md:1.5rem;
  --space-lg:2rem;
  --space-xl:3rem;
  --space-2xl:4rem;

  /* letter-tracking scale — small caps labels are tracked wide, display
     serif a touch loose, body normal (premium editorial convention) */
  --track-label:0.22em;
  --track-display:0.04em;

  --tap-min:3.6rem;
  --dur-fast:180ms;
  --dur-med:320ms;
  --dur-slow:560ms;
  /* decelerate on arrival, gentle standard curve for state changes
     (design-system MASTER §4 — motion is subtle, meaning-carrying) */
  --ease-out:cubic-bezier(0.16,1,0.3,1);
  --ease-std:cubic-bezier(0.4,0,0.2,1);

  --serif:"Fraunces","Iowan Old Style","Palatino Linotype","Book Antiqua",Georgia,"Noto Serif JP",serif;
  --sans:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}

html[data-textsize="normal"]{ font-size:16px; }
html[data-textsize="large"]{ font-size:19px; }
html[data-textsize="xlarge"]{ font-size:23px; }

*,*::before,*::after{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0;
  font-family:var(--sans);
  color:var(--ink);
  background:var(--wine-950);
  overflow:hidden;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
h1,h2,h3{
  font-family:var(--serif);
  margin:0;
  font-weight:600;
  letter-spacing:var(--track-display);
}
button{ font:inherit; color:inherit; }
img,svg{ display:block; }

/* gilded display type — a foil gradient clipped to the glyphs, with a
   faint cast so it lifts off the wine ground. `.gilt` is reused by the
   wordmark, section headings, tile + range names and the CTA label.
   High-contrast mode (further down) swaps it for one solid bright gold. */
.gilt{
  background:var(--foil);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  -webkit-text-fill-color:transparent;
}
/* small-caps label — tracked wide, used for meta rows, section kickers,
   dt terms, pill text */
.kicker{
  font-family:var(--sans);
  text-transform:uppercase;
  letter-spacing:var(--track-label);
  font-size:0.72rem;
  font-weight:600;
}

/* ---------- app shell ---------- */
#app{
  position:relative;
  height:100vh;
  height:100dvh;
  width:100vw;
  overflow:hidden;
  color:var(--ink);
  background:
    radial-gradient(120% 78% at 50% -8%, rgba(224,176,74,0.10) 0%, rgba(224,176,74,0) 42%),
    radial-gradient(82% 58% at 50% 6%, var(--wine-700) 0%, var(--wine-900) 52%, var(--wine-950) 100%),
    var(--wine-950);
}
/* faint tiled seasonal motif — a sparse eight-point star, barely there,
   gives the wine ground a boutique-wallpaper texture instead of a flat
   fill. One static background-image, no runtime cost. */
#app::before{
  content:"";
  position:absolute; inset:0;
  pointer-events:none;
  opacity:0.6;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='84' height='84'><g fill='%23e0b04a' fill-opacity='0.028'><path d='M42 30l1.6 9.4 9.4-1.6-7 7 7 7-9.4-1.6L42 66l-1.6-9.4-9.4 1.6 7-7-7-7 9.4 1.6z'/><circle cx='10' cy='10' r='1'/><circle cx='74' cy='58' r='1'/></g></svg>");
  background-size:104px 104px;
}
/* subtle static grain for warmth — one background-image, no runtime cost */
#app::after{
  content:"";
  position:absolute; inset:0;
  pointer-events:none;
  opacity:0.045;
  mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  background-size:180px 180px;
}
html[data-contrast="high"] #app{ background:#180208; }
html[data-contrast="high"] #app::after,
html[data-contrast="high"] #app::before{ display:none; }

/* ---------- ornament frame (Attract showpiece) ----------
   A gilt hairline inset from the bezel with filigree corners — the
   "festive boutique" frame. Only on Attract; the browse screens carry
   the theme through card frames + ruled headings instead (their content
   scrolls, so a fixed frame would clip oddly at the edges). */
.ornament-frame{
  position:absolute; inset:0.85rem;
  border:1px solid var(--gilt-soft);
  border-radius:0.5rem;
  pointer-events:none;
  z-index:6;
}
.ornament-frame::before{
  content:"";
  position:absolute; inset:0.28rem;
  border:1px solid var(--gilt-faint);
  border-radius:0.32rem;
}
.ornament-frame > i{
  position:absolute; width:2.6rem; height:2.6rem;
  background:no-repeat center/contain;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40' fill='none' stroke='%23cb951a' stroke-width='1.4' stroke-linecap='round'><path d='M2 2h12M2 2v12M2 2q10 2 13 10M9 2q5 1 7 4'/><circle cx='4.6' cy='4.6' r='1.5' fill='%23cb951a' stroke='none'/></svg>");
}
.ornament-frame > i:nth-child(1){ top:-0.5rem; left:-0.5rem; }
.ornament-frame > i:nth-child(2){ top:-0.5rem; right:-0.5rem; transform:scaleX(-1); }
.ornament-frame > i:nth-child(3){ bottom:-0.5rem; left:-0.5rem; transform:scaleY(-1); }
.ornament-frame > i:nth-child(4){ bottom:-0.5rem; right:-0.5rem; transform:scale(-1); }
html[data-contrast="high"] .ornament-frame{ border-color:#ffd257; }
html[data-contrast="high"] .ornament-frame::before,
html[data-contrast="high"] .ornament-frame > i{ display:none; }

#live-region{
  position:absolute; width:1px; height:1px; overflow:hidden;
  clip:rect(0 0 0 0); white-space:nowrap;
}

/* ---------- topbar ---------- */
.topbar{
  position:relative;
  z-index:20;
  display:flex;
  align-items:center;
  gap:0.6rem;
  padding:0.85rem 1.15rem 0.8rem;
  color:var(--cream-100);
  background:linear-gradient(180deg, rgba(28,5,18,0.55), rgba(28,5,18,0));
  border-bottom:1px solid var(--gilt-soft);
}
/* a second, brighter hairline just under the border — a gilt reveal */
.topbar::after{
  content:"";
  position:absolute; left:1.15rem; right:1.15rem; bottom:-2px; height:1px;
  background:linear-gradient(90deg, transparent, var(--gilt-faint) 15%, var(--gilt-faint) 85%, transparent);
}
.topbar .spacer{ flex:1 1 auto; min-width:0; }
.topbar-title{
  font-family:var(--serif);
  font-size:1.12rem;
  letter-spacing:0.015em;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  color:var(--cream-050);
}
.icon-btn{
  min-width:var(--tap-min);
  min-height:var(--tap-min);
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:0.38rem;
  padding:0 0.95rem;
  background:rgba(248,242,226,0.07);
  border:1px solid var(--gilt-soft);
  border-radius:999px;
  cursor:pointer;
  font-size:0.95rem;
  letter-spacing:0.04em;
  line-height:1;
  color:var(--cream-100);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.06);
  transition:background var(--dur-fast) ease, border-color var(--dur-fast) ease, transform var(--dur-fast) ease;
}
.icon-btn:hover{ background:rgba(248,242,226,0.14); border-color:var(--gilt); }
.icon-btn:active{ transform:scale(0.95); }
.icon-btn[aria-pressed="true"]{
  background:var(--foil-soft); color:var(--wine-900);
  border-color:var(--gold-400);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.4);
}
.icon-btn.back-btn{ padding:0 1.15rem 0 0.75rem; }
/* chrome icons are inline SVG (no emoji — MASTER §9): stroke inherits
   the button's `color`, so they track cream-on-wine, wine-on-gold when
   pressed, and white in high-contrast mode automatically. */
.icon-btn svg{ width:1.3rem; height:1.3rem; flex-shrink:0; }
.topbar-controls{ display:flex; align-items:center; gap:0.5rem; flex-wrap:nowrap; }

/* language switcher */
.lang-switch{ position:relative; }
.lang-menu{
  position:absolute; top:calc(100% + 0.6rem); right:0;
  background:linear-gradient(180deg, var(--cream-000), var(--cream-100));
  color:var(--ink);
  border-radius:var(--radius-md);
  border:1px solid var(--gilt);
  box-shadow:var(--shadow-lift);
  padding:0.5rem;
  display:none;
  min-width:12rem;
  z-index:40;
}
.lang-menu[data-open="true"]{ display:block; animation:menu-in 200ms var(--ease-out); }
@keyframes menu-in{ from{ opacity:0; transform:translateY(-0.35rem); } }
.lang-menu button{
  display:flex; width:100%; align-items:center; justify-content:space-between; gap:0.6rem;
  min-height:2.9rem; padding:0 0.85rem; border:0; background:transparent;
  border-radius:var(--radius-sm); cursor:pointer; font-size:0.98rem;
  font-family:var(--serif); color:var(--ink);
  transition:background var(--dur-fast) ease;
}
.lang-menu button + button{ margin-top:0.1rem; }
.lang-menu button:hover{ background:rgba(84,18,50,0.07); }
.lang-menu button[aria-disabled="true"]{ opacity:0.4; cursor:default; }
.lang-menu button[aria-current="true"]{
  background:var(--wine-800); color:var(--cream-050);
  box-shadow:inset 0.16rem 0 0 var(--gold-400);
}
.lang-soon{
  font-family:var(--sans); font-size:0.62rem; text-transform:uppercase;
  letter-spacing:0.14em; color:var(--gold-700); opacity:0.9;
}

/* ---------- screens ---------- */
.screen{
  position:absolute; inset:0;
  display:flex; flex-direction:column;
  opacity:0; transform:translateY(0.6rem);
  animation:screen-in var(--dur-med) var(--ease-out) forwards;
  overflow:hidden;
}
@keyframes screen-in{ to{ opacity:1; transform:translateY(0); } }

/* Staggered card entrance — a small fade+rise per item so a list
   assembles rather than snapping in (design-system: Stagger List,
   Subtle tier — ~40ms/item, 8-16px rise). Disabled under reduced
   motion further down. */
@keyframes card-in{ from{ opacity:0; transform:translateY(0.7rem); } to{ opacity:1; transform:translateY(0); } }
/* tiles are absolutely positioned with translate(-50%,-50%); a transform
   keyframe would fight that, so they fade only */
@keyframes tile-in{ from{ opacity:0; } to{ opacity:1; } }
.range-card, .blend-chip{ animation:card-in 360ms var(--ease-out) both; }
.wreath-medallion{ animation:tile-in var(--dur-slow) var(--ease-out) both; }
.tile{ animation:tile-in 420ms var(--ease-out) both; }
.tile:nth-of-type(1){ animation-delay:120ms; }
.tile:nth-of-type(2){ animation-delay:190ms; }
.tile:nth-of-type(3){ animation-delay:260ms; }
.card-grid > *:nth-child(1), .blend-chip-grid > *:nth-child(1){ animation-delay:40ms; }
.card-grid > *:nth-child(2), .blend-chip-grid > *:nth-child(2){ animation-delay:80ms; }
.card-grid > *:nth-child(3), .blend-chip-grid > *:nth-child(3){ animation-delay:120ms; }
.card-grid > *:nth-child(4), .blend-chip-grid > *:nth-child(4){ animation-delay:160ms; }
.card-grid > *:nth-child(5), .blend-chip-grid > *:nth-child(5){ animation-delay:200ms; }
.card-grid > *:nth-child(n+6), .blend-chip-grid > *:nth-child(n+6){ animation-delay:240ms; }
/* `safe center`: a short list (e.g. a 2-card category, or a 3-blend
   Range) centers in the available space instead of sitting pinned
   to the top with a dead zone below it; a long one that overflows
   falls back to start-aligned so the top of the list is never
   scrolled-past-reach. Chrome/Safari on the target tablet both
   support `safe`; older engines just treat it as plain `center`,
   which is still fine for the short lists that are the common case. */
.screen-scroll{
  flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch;
  padding:1.4rem 1.4rem 2.8rem;
  display:flex; flex-direction:column; justify-content:safe center; gap:1.35rem;
}

/* ===== Attract ===== */
.screen-attract{ align-items:center; justify-content:center; text-align:center; }
.snowfall{ position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:1; }
.snowflake{
  position:absolute; top:-5%; color:var(--cream-050); will-change:transform;
  animation-name:snow-fall; animation-timing-function:linear; animation-iteration-count:infinite;
}
.snowfall .far{ opacity:0.28; filter:blur(1.1px); }
.snowfall .mid{ opacity:0.55; }
.snowfall .near{ opacity:0.82; filter:drop-shadow(0 1px 2px rgba(20,4,12,0.3)); }
@keyframes snow-fall{
  0%{ transform:translate3d(0,-10vh,0) rotate(0deg); }
  100%{ transform:translate3d(var(--drift,2rem),115vh,0) rotate(200deg); }
}
.attract-glow{
  position:absolute; left:50%; top:30%; width:34rem; height:34rem; transform:translate(-50%,-50%);
  background:
    radial-gradient(circle, rgba(224,176,74,0.30) 0%, rgba(224,176,74,0) 62%),
    radial-gradient(circle, rgba(84,18,50,0.5) 0%, rgba(84,18,50,0) 70%);
  pointer-events:none; z-index:1;
}
.attract-content{
  position:relative; z-index:4;
  display:flex; flex-direction:column; align-items:center; gap:1.6rem;
  padding:0 1.5rem;
}

/* ---- wordmark lockup (real type + drawn ornament, replaces the
   PDF-traced path that rendered as mangled letterforms). SIP / THE /
   SEASON stacked and centred, gilded, a holly sprig above and hairline
   rules flanking the small tracked "THE". Sizes off one clamp on
   `.wm`; everything inside is em-relative. */
.wordmark{ margin:0; line-height:1; }
.wm{
  display:flex; flex-direction:column; align-items:center;
  font-size:clamp(2.7rem, 11.5vw, 5.1rem);
  gap:0.06em;
}
.wm-sprig{ width:3.4em; height:auto; margin-bottom:0.12em; }
.wm-sprig path,.wm-sprig circle{ /* colours baked into the SVG */ }
.wm-line{
  font-family:var(--serif); font-weight:600;
  text-transform:uppercase; letter-spacing:0.05em;
  line-height:0.86;
  background:var(--foil); -webkit-background-clip:text; background-clip:text;
  color:transparent; -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0.03em 0.14em rgba(20,4,12,0.55));
}
.wm-sip{ font-size:1em; }
.wm-season{ font-size:1em; }
.wm-the{
  display:flex; align-items:center; gap:0.7em;
  font-family:var(--sans); font-weight:600;
  font-size:0.19em; letter-spacing:0.62em;
  text-indent:0.62em; text-transform:uppercase;
  color:var(--gold-400);
  margin:0.15em 0 0.1em;
}
.wm-the i{
  width:2.6em; height:1px; display:block;
  background:linear-gradient(90deg, transparent, var(--gold-600) 60%, var(--gold-400));
}
.wm-the i:last-child{ transform:scaleX(-1); }

.tagline{
  font-family:var(--sans);
  color:var(--gold-400);
  letter-spacing:0.3em; text-transform:uppercase;
  font-size:0.72rem; font-weight:600;
  margin:0.1rem 0 0;
  display:flex; align-items:center; gap:0.8rem;
}
.tagline::before,.tagline::after{
  content:""; width:1.6rem; height:1px;
  background:linear-gradient(90deg, transparent, var(--gold-600));
}
.tagline::after{ transform:scaleX(-1); }

.cta-begin{
  margin-top:1rem;
  min-height:4.2rem;
  padding:0 2.8rem;
  border-radius:999px;
  border:1px solid var(--gold-300);
  background:var(--foil);
  color:var(--wine-900);
  font-family:var(--sans);
  font-size:0.95rem; font-weight:700;
  letter-spacing:0.2em;
  text-transform:uppercase;
  cursor:pointer;
  position:relative;
  overflow:hidden;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.55),
    inset 0 -1px 0 rgba(122,84,8,0.4),
    0 0.5rem 1.5rem rgba(20,4,12,0.4);
  transition:transform var(--dur-fast) ease, box-shadow var(--dur-fast) ease;
}
/* drawn four-point spark before the label (no glyph — MASTER §9/§10) */
.cta-begin::before{
  content:""; display:inline-block; width:0.5em; height:0.5em;
  margin-right:0.85em; vertical-align:0.05em;
  background:var(--wine-800);
  -webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 0c1 6 5 10 12 12-7 2-11 6-12 12-1-6-5-10-12-12 7-2 11-6 12-12z'/></svg>") center/contain no-repeat;
  mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 0c1 6 5 10 12 12-7 2-11 6-12 12-1-6-5-10-12-12 7-2 11-6 12-12z'/></svg>") center/contain no-repeat;
}
.cta-begin::after{
  content:""; position:absolute; inset:0; border-radius:inherit;
  background:linear-gradient(100deg, transparent 42%, rgba(255,253,247,0.55) 50%, transparent 58%);
  transform:translateX(-120%);
  animation:shimmer 3.6s ease-in-out infinite;
}
.cta-begin:active{ transform:translateY(1px) scale(0.995); box-shadow:inset 0 1px 0 rgba(255,255,255,0.4), 0 0.2rem 0.6rem rgba(20,4,12,0.4); }
@keyframes shimmer{ 0%,58%{ transform:translateX(-120%);} 100%{ transform:translateX(120%);} }
.attract-a11y{ position:absolute; top:1.4rem; right:1.4rem; display:flex; gap:0.5rem; z-index:8; }
.attract-lang{ position:absolute; top:1.4rem; left:1.4rem; z-index:8; }
/* Attract has no .topbar to inherit a light `color` from — set it here
   so the corner chrome icons (and the "Aa" label) read on the dark ground. */
.attract-a11y .icon-btn, .attract-lang > .lang-switch > .icon-btn{ color:var(--cream-100); }
/* The dropdown default anchors right:0, which is correct when its
   trigger sits near the topbar's right edge — but on the Attract
   screen the trigger sits at top-LEFT instead, so a right-anchored
   panel would spill off the left edge of the viewport. Anchor from
   the left there instead. */
.attract-lang .lang-menu{ right:auto; left:0; }

/* ===== Category / Range / Blend section heading ===== */
/* Centred, gilded, flanked by tapered hairline rules with a small
   drawn diamond — the boutique "chapter title" treatment used on
   every non-Attract screen heading. */
.section-heading{ color:var(--cream-100); padding:1.2rem 1.3rem 0.4rem; text-align:center; }
.section-heading h2{
  display:inline-flex; align-items:center; gap:0.95rem;
  font-size:clamp(1.55rem, 5.2vw, 2rem);
  background:var(--foil); -webkit-background-clip:text; background-clip:text;
  color:transparent; -webkit-text-fill-color:transparent;
}
.section-heading h2::before,.section-heading h2::after{
  content:""; width:clamp(1.4rem,7vw,3rem); height:1px; flex-shrink:0;
  background:linear-gradient(90deg, transparent, var(--gold-600));
  -webkit-text-fill-color:initial;
}
.section-heading h2::after{ transform:scaleX(-1); }
.section-heading p{
  margin:0.4rem 0 0; color:var(--cream-050); opacity:0.72;
  font-family:var(--sans); font-size:0.72rem;
  letter-spacing:0.18em; text-transform:uppercase;
}

/* Exactly 3 categories, permanently (PRD §1) — arranged around a
   wreath rather than a grid row. A gilded medallion anchors the
   centre so the composition reads as intentional, not three tiles
   floating around a void. nth-child is safe here because
   CATEGORIES.map() always emits them in the same fixed order. */
.tile-grid{
  position:relative;
  width:min(95vw, 42rem);
  height:min(74vh, 44rem);
  margin:0.2rem auto 0;
}
.wreath-medallion{
  position:absolute; left:50%; top:49.5%;
  width:min(21vw, 8rem); aspect-ratio:1;
  transform:translate(-50%,-50%);
  display:flex; align-items:center; justify-content:center;
  pointer-events:none; z-index:1;
}
.wreath-medallion svg{ width:100%; height:100%; }
.tile{
  position:absolute;
  width:38%;
  max-width:14rem;
  min-height:14.5rem;
  transform:translate(-50%,-50%);
  background:linear-gradient(165deg, rgba(248,242,226,0.16), rgba(248,242,226,0.05));
  border:1px solid var(--gilt-soft);
  border-radius:var(--radius-lg);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0.7rem;
  color:var(--cream-100);
  cursor:pointer;
  padding:1.35rem 1rem 1.15rem;
  box-shadow:var(--shadow-soft), inset 0 1px 0 rgba(255,255,255,0.1);
  transition:transform var(--dur-fast) ease, border-color var(--dur-fast) ease;
  z-index:2;
}
/* inset gilt frame — the double-line boutique border */
.tile::after{
  content:""; position:absolute; inset:0.5rem;
  border:1px solid var(--gilt-faint);
  border-radius:calc(var(--radius-lg) - 0.4rem);
  pointer-events:none;
}
/* nth-of-type counts <button> siblings only, so the medallion <div>
   in the same .tile-grid never shifts the numbering. One tile at
   12 o'clock, two at the base — a wreath with the medallion at its
   heart. */
.tile:nth-of-type(1){ left:50%; top:12.5%; }
.tile:nth-of-type(2){ left:81%; top:82%; }
.tile:nth-of-type(3){ left:19%; top:82%; }
.tile:active{ transform:translate(-50%,-50%) scale(0.97); border-color:var(--gilt); }
.tile-text{ display:flex; flex-direction:column; align-items:center; gap:0.35rem; min-width:0; }
.badge{
  width:6.4rem; height:6.4rem; border-radius:50%;
  background:radial-gradient(circle at 36% 30%, var(--cream-000), var(--cream-050) 55%, #efe2c4 100%);
  border:1px solid var(--gold-600);
  display:flex; align-items:center; justify-content:center;
  box-shadow:
    0 0 0 0.32rem rgba(203,149,26,0.16),
    inset 0 0.1rem 0.32rem rgba(255,255,255,0.7),
    0 0.4rem 0.9rem rgba(20,4,12,0.34);
  flex-shrink:0;
}
/* Brand illustrations have varied aspect ratios — contain within the
   circle, keep proportions. */
.badge svg{ width:auto; height:auto; max-width:76%; max-height:86%; }
/* The 3 hero category tiles read as the headline choice on this
   screen, so their badge is bigger than the same badge reused inside
   a Range-grid list card (below). */
.tile .badge{ width:8.4rem; height:8.4rem; }
.tile .badge svg{ max-width:78%; max-height:88%; }
.tile-name{
  font-family:var(--serif); font-size:1.32rem; letter-spacing:0.02em;
  background:var(--foil); -webkit-background-clip:text; background-clip:text;
  color:transparent; -webkit-text-fill-color:transparent;
}
.tile-blurb{
  font-family:var(--sans); font-size:0.62rem; letter-spacing:0.13em;
  text-transform:uppercase; color:var(--cream-050); opacity:0.72; text-align:center;
}

/* Enlarged text: the absolute-positioned wreath can't hold three tiles
   full of the longest translation without colliding, so at `large` /
   `xlarge` it degrades to a clean scrollable stack — the medallion and
   the orbit are a normal-size flourish, legibility wins when text is up
   (MASTER §8 text-reflow). */
html[data-textsize="large"] .tile-grid,
html[data-textsize="xlarge"] .tile-grid{
  position:static; width:min(94vw, 30rem); height:auto;
  display:flex; flex-direction:column; gap:1.1rem; margin:0 auto;
}
html[data-textsize="large"] .wreath-medallion,
html[data-textsize="xlarge"] .wreath-medallion{ display:none; }
html[data-textsize="large"] .tile,
html[data-textsize="xlarge"] .tile{
  position:static; transform:none; width:100%; max-width:none; min-height:0;
  flex-direction:row; justify-content:flex-start; gap:1.2rem;
  padding:1.2rem 1.3rem;
}
html[data-textsize="large"] .tile:active,
html[data-textsize="xlarge"] .tile:active{ transform:scale(0.98); }
html[data-textsize="large"] .tile .badge,
html[data-textsize="xlarge"] .tile .badge{ width:5.4rem; height:5.4rem; }
html[data-textsize="large"] .tile-text,
html[data-textsize="xlarge"] .tile-text{ align-items:flex-start; text-align:left; }
html[data-textsize="large"] .tile-blurb,
html[data-textsize="xlarge"] .tile-blurb{ text-align:left; }

/* ===== Range grid ===== */
.card-grid{
  display:grid; gap:1.3rem;
  grid-template-columns:repeat(auto-fit, minmax(19rem, 1fr));
  width:100%; max-width:60rem; margin:0 auto;
}
.range-card{
  position:relative;
  background:linear-gradient(180deg, var(--cream-000), var(--cream-100) 22%);
  border:1px solid var(--gilt-on-cream);
  border-radius:var(--radius-lg);
  padding:1.5rem 1.6rem;
  display:flex; align-items:center; gap:1.35rem;
  text-align:left;
  cursor:pointer;
  box-shadow:var(--shadow-soft), var(--edge-cream);
  min-height:10rem;
  transition:transform var(--dur-fast) ease, box-shadow var(--dur-fast) ease;
}
/* inset gilt frame */
.range-card::after{
  content:""; position:absolute; inset:0.42rem;
  border:1px solid rgba(203,149,26,0.2);
  border-radius:calc(var(--radius-lg) - 0.32rem);
  pointer-events:none;
}
.range-card:active{ transform:scale(0.985); box-shadow:var(--shadow-lift), var(--edge-cream); }
.range-card.badge-ring-red .badge{ border-color:#a3213c; box-shadow:0 0 0 0.32rem rgba(163,33,60,0.14), inset 0 0.1rem 0.32rem rgba(255,255,255,0.7), 0 0.4rem 0.9rem rgba(20,4,12,0.34); }
.range-card.badge-ring-green .badge{ border-color:var(--green-600); box-shadow:0 0 0 0.32rem rgba(39,129,58,0.14), inset 0 0.1rem 0.32rem rgba(255,255,255,0.7), 0 0.4rem 0.9rem rgba(20,4,12,0.34); }
.range-card.badge-ring-white .badge{ border-color:var(--wine-700); background:radial-gradient(circle at 36% 30%,#fff,var(--cream-050) 70%); box-shadow:0 0 0 0.32rem rgba(84,18,50,0.12), inset 0 0.1rem 0.32rem rgba(255,255,255,0.8), 0 0.4rem 0.9rem rgba(20,4,12,0.34); }
.range-card.badge-ring-blue .badge{ border-color:var(--navy-500); box-shadow:0 0 0 0.32rem rgba(47,93,138,0.14), inset 0 0.1rem 0.32rem rgba(255,255,255,0.7), 0 0.4rem 0.9rem rgba(20,4,12,0.34); }
.range-card.highlight{ outline:0.16rem solid var(--gold-600); outline-offset:0.24rem; }
.range-body{ min-width:0; flex:1 1 auto; display:flex; flex-direction:column; gap:0.5rem; }
.range-name{
  font-family:var(--serif); font-size:1.32rem; color:var(--wine-900); line-height:1.22;
}
/* short gilt rule under the name */
.range-name::after{
  content:""; display:block; width:2.2rem; height:2px; margin-top:0.55rem;
  background:var(--foil-soft); border-radius:2px;
}
.range-meta{
  font-family:var(--sans); font-size:0.72rem; letter-spacing:0.13em;
  text-transform:uppercase; color:var(--cocoa); margin-top:0.1rem;
}
.swatch-row{ display:flex; flex-wrap:wrap; gap:0.55rem; margin-top:0.5rem; }
.swatch{
  display:inline-flex; align-items:center; gap:0.45rem;
  min-height:2.6rem; padding:0 0.8rem 0 0.45rem;
  border-radius:999px; border:1px solid var(--gilt);
  background:var(--cream-000); cursor:pointer;
  font-family:var(--sans); font-size:0.72rem; letter-spacing:0.08em;
  text-transform:uppercase; color:var(--ink);
}
/* Opaque, not translucent — this pill sits on both a cream card
   (range grid) and the dark wine page background (blend list), and
   a semi-transparent fill read fine on cream but went low-contrast
   dark-on-dark on wine. A solid fill is legible on both. */
.swatch[aria-pressed="true"]{ border-color:var(--wine-900); background:var(--foil-soft); color:var(--wine-900); font-weight:700; }
.swatch-dot{ width:1rem; height:1rem; border-radius:50%; border:1px solid rgba(0,0,0,0.25); flex-shrink:0; box-shadow:inset 0 0 0 1px rgba(255,255,255,0.35); }

/* ===== Blend list ===== */
.blend-list-header{ padding:1.1rem 1.3rem 0.3rem; color:var(--cream-100); text-align:center; }
.blend-list-header h2{
  font-size:clamp(1.45rem, 4.8vw, 1.85rem);
  background:var(--foil); -webkit-background-clip:text; background-clip:text;
  color:transparent; -webkit-text-fill-color:transparent;
}
.blend-list-header .meta{
  color:var(--cream-050); opacity:0.7; margin-top:0.4rem;
  font-family:var(--sans); font-size:0.7rem; letter-spacing:0.14em; text-transform:uppercase;
}
.blend-chip-grid{ display:grid; gap:1rem; grid-template-columns:repeat(auto-fit, minmax(17rem,1fr)); width:100%; max-width:60rem; margin:0 auto; }
.blend-chip{
  position:relative;
  background:linear-gradient(180deg, var(--cream-000), var(--cream-100) 24%);
  border-radius:var(--radius-md); border:1px solid var(--gilt-on-cream);
  padding:1.25rem 1.4rem; text-align:left; cursor:pointer; min-height:6rem;
  display:flex; flex-direction:column; justify-content:center; gap:0.3rem;
  box-shadow:var(--shadow-soft), var(--edge-cream);
  transition:transform var(--dur-fast) ease, box-shadow var(--dur-fast) ease;
}
.blend-chip::before{
  content:""; position:absolute; left:0; top:0.9rem; bottom:0.9rem; width:2px;
  background:var(--foil-soft); border-radius:0 2px 2px 0;
}
.blend-chip:active{ transform:scale(0.985); box-shadow:var(--shadow-lift), var(--edge-cream); }
.blend-chip .name-en{ font-family:var(--serif); font-size:1.18rem; color:var(--wine-900); line-height:1.25; }
.blend-chip .chip-meta{ display:flex; gap:0.5rem; margin-top:0.5rem; flex-wrap:wrap; }
.pill{
  font-family:var(--sans); font-size:0.66rem; font-weight:600;
  letter-spacing:0.1em; text-transform:uppercase;
  padding:0.34rem 0.7rem; border-radius:999px;
  background:rgba(84,18,50,0.06); color:var(--wine-700);
  border:1px solid rgba(84,18,50,0.12);
}
.pill.allergen{ background:rgba(203,149,26,0.16); color:var(--gold-800); border-color:rgba(203,149,26,0.42); }

/* ===== Blend detail ===== */
.detail-card{
  position:relative;
  background:linear-gradient(180deg, var(--cream-000), var(--cream-100) 14%);
  border-radius:var(--radius-lg); padding:1.5rem;
  border:1px solid var(--gilt);
  box-shadow:var(--shadow-lift), var(--edge-cream);
  max-width:42rem; margin:0 auto; color:var(--ink);
}
.detail-card::after{
  content:""; position:absolute; inset:0.55rem;
  border:1px solid rgba(203,149,26,0.22);
  border-radius:calc(var(--radius-lg) - 0.4rem);
  pointer-events:none;
}
.detail-card > *{ position:relative; z-index:1; }
/* "photography still to come" panel — a warm gilt-framed plate, not a
   dashed-border placeholder. Reads as considered empty space. */
.detail-media{
  height:13.5rem; border-radius:var(--radius-md); margin-bottom:1.3rem;
  background:
    radial-gradient(circle at 50% 40%, rgba(224,176,74,0.16), rgba(224,176,74,0) 60%),
    linear-gradient(160deg, var(--wine-700), var(--wine-950));
  display:flex; align-items:center; justify-content:center; color:var(--gold-400);
  text-align:center; padding:1rem; gap:0.75rem; flex-direction:column;
  border:1px solid var(--gilt);
  position:relative; overflow:hidden;
}
.detail-media::after{
  content:""; position:absolute; inset:0.42rem;
  border:1px solid var(--gilt-faint); border-radius:calc(var(--radius-md) - 0.32rem);
}
.detail-media svg{ width:2.9rem; height:2.9rem; opacity:0.72; }
.detail-media span{ font-family:var(--sans); font-size:0.66rem; letter-spacing:0.2em; text-transform:uppercase; }
.detail-title-en{
  font-size:clamp(1.6rem, 5.5vw, 2rem); color:var(--wine-900); line-height:1.15;
}
.detail-title-en::after{
  content:""; display:block; width:2.6rem; height:2px; margin-top:0.7rem;
  background:var(--foil-soft); border-radius:2px;
}
.detail-card dl{ margin:1.2rem 0 0; }
.detail-row{ display:flex; justify-content:space-between; gap:1rem; padding:0.9rem 0; border-top:1px solid rgba(203,149,26,0.28); font-size:1.02rem; }
.detail-row:first-child{ border-top:0; }
.detail-row dt{ font-family:var(--sans); font-size:0.7rem; font-weight:600; letter-spacing:0.14em; text-transform:uppercase; color:var(--cocoa); align-self:center; }
.detail-row dd{ margin:0; text-align:right; max-width:62%; color:var(--wine-900); }
.detail-block{ margin-top:1.4rem; }
.detail-block h3{
  display:flex; align-items:center; gap:0.6rem;
  font-family:var(--sans); font-size:0.72rem; font-weight:600;
  text-transform:uppercase; letter-spacing:0.18em; color:var(--gold-700); margin-bottom:0.6rem;
}
.detail-block h3::before{ content:""; width:1.1rem; height:1px; background:var(--gold-600); flex-shrink:0; }
.pending{
  border:1px solid rgba(203,149,26,0.32); border-radius:var(--radius-sm);
  padding:0.9rem 1.1rem; font-size:0.95rem; color:var(--cocoa-deep); font-style:italic;
  background:rgba(203,149,26,0.06);
  display:flex; align-items:center; gap:0.6rem;
}
.pending svg{ width:1.6rem; height:1.6rem; flex-shrink:0; opacity:0.7; }
/* real ingredient copy — content-driven height, unitless line-height so it
   survives the text-size cycle in every language (MASTER §8 text reflow) */
.ingredients-body{ margin:0; font-size:0.98rem; line-height:1.6; color:var(--ink); }
html[data-contrast="high"] .ingredients-body{ color:#000; }
.allergen-note{ font-size:0.9rem; color:var(--cocoa); margin-top:0.4rem; }
.staff-note{
  font-family:var(--sans); font-size:0.9rem; line-height:1.5; color:var(--wine-800);
  background:rgba(203,149,26,0.12); border-radius:var(--radius-sm);
  border-left:0.2rem solid var(--gold-600);
  padding:0.85rem 1rem; margin-top:1.5rem;
}

/* ===== search overlay ===== */
.search-overlay{
  position:absolute; inset:0; z-index:50; background:rgba(20,4,12,0.62);
  display:none; align-items:flex-start; justify-content:center; padding:4.5rem 1rem 1rem;
}
.search-overlay[data-open="true"]{ display:flex; animation:menu-in 200ms var(--ease-out); }
.search-panel{
  position:relative;
  background:linear-gradient(180deg, var(--cream-000), var(--cream-100) 16%);
  width:100%; max-width:32rem; border-radius:var(--radius-lg);
  border:1px solid var(--gilt);
  box-shadow:var(--shadow-lift), var(--edge-cream);
  padding:1.1rem; max-height:80vh; display:flex; flex-direction:column;
}
.search-input-row{ display:flex; gap:0.5rem; }
/* the close button sits on the cream panel, not the wine chrome — give it
   an ink-on-cream treatment so it doesn't vanish */
.search-input-row .icon-btn{
  color:var(--wine-800); background:var(--cream-050);
  border-color:var(--gilt); box-shadow:none; flex-shrink:0;
}
.search-input-row .icon-btn:active{ background:var(--cream-100); }
.search-input-row input{
  flex:1; min-height:3.3rem; border-radius:999px; border:1px solid var(--gilt);
  padding:0 1.2rem; font-size:1rem; background:var(--cream-000); color:var(--ink);
  font-family:var(--sans);
}
.search-input-row input:focus{ outline:none; border-color:var(--gold-600); box-shadow:0 0 0 3px rgba(224,176,74,0.4); }
.search-results{ margin-top:0.9rem; overflow-y:auto; display:flex; flex-direction:column; gap:0.45rem; }
.search-result{
  text-align:left; border:1px solid var(--gilt-on-cream); background:var(--cream-050); border-radius:var(--radius-sm);
  padding:0.75rem 0.95rem; cursor:pointer; min-height:3rem;
  transition:background var(--dur-fast) ease, border-color var(--dur-fast) ease;
}
.search-result:hover{ background:var(--cream-000); border-color:var(--gilt); }
.search-result .sr-type{
  font-family:var(--sans); font-size:0.62rem; text-transform:uppercase;
  letter-spacing:0.16em; color:var(--gold-700); font-weight:600;
}
.search-result > div:last-child{ font-family:var(--serif); color:var(--wine-900); margin-top:0.15rem; }
.search-hint{ font-family:var(--sans); font-size:0.72rem; letter-spacing:0.04em; color:var(--cocoa); padding:0.7rem 0.2rem 0; }

/* ===== high contrast overrides =====
   Every gilded/foil surface added in the overhaul needs an explicit
   solid-colour fallback here — a clipped gradient text fill and a
   translucent hairline both fail the contrast floor otherwise
   (MASTER §2, §8). Rule of thumb: foil text -> one solid #ffd257,
   cream gradients -> flat #fff + 2px #000, decorative inset frames
   and dotted rings -> hidden. */
html[data-contrast="high"] .screen-category .section-heading,
html[data-contrast="high"] .blend-list-header,
html[data-contrast="high"] .topbar,
html[data-contrast="high"] .tagline,
html[data-contrast="high"] .tile{ color:#fff; }
html[data-contrast="high"] .topbar{ border-bottom-color:#fff; background:none; }
html[data-contrast="high"] .topbar::after{ display:none; }

/* foil-clipped display type -> one solid bright gold */
html[data-contrast="high"] .wm-line,
html[data-contrast="high"] .section-heading h2,
html[data-contrast="high"] .blend-list-header h2,
html[data-contrast="high"] .tile-name{
  background:none; color:#ffd257; -webkit-text-fill-color:#ffd257; filter:none;
}
html[data-contrast="high"] .wm-the{ color:#ffd257; background:none; -webkit-text-fill-color:#ffd257; }
html[data-contrast="high"] .wm-the i{ background:#ffd257; }
html[data-contrast="high"] .section-heading h2::before,
html[data-contrast="high"] .section-heading h2::after{ background:#ffd257; }

html[data-contrast="high"] .tile{ background:#000; border-color:#fff; }
html[data-contrast="high"] .tile::after,
html[data-contrast="high"] .range-card::after,
html[data-contrast="high"] .detail-card::after,
html[data-contrast="high"] .detail-media::after,
html[data-contrast="high"] .blend-chip::before{ display:none; }
html[data-contrast="high"] .wreath-medallion{ opacity:0.5; }
html[data-contrast="high"] .badge{ background:#fff; border-color:#ffd257; box-shadow:0 0 0 2px #000; }
html[data-contrast="high"] .range-card,
html[data-contrast="high"] .blend-chip,
html[data-contrast="high"] .detail-card,
html[data-contrast="high"] .search-panel,
html[data-contrast="high"] .search-result{ background:#fff; border:2px solid #000; box-shadow:none; }
html[data-contrast="high"] .range-name,
html[data-contrast="high"] .blend-chip .name-en,
html[data-contrast="high"] .search-result > div:last-child,
html[data-contrast="high"] .detail-title-en,
html[data-contrast="high"] .detail-row dd{ color:#000; }
html[data-contrast="high"] .range-name::after,
html[data-contrast="high"] .detail-title-en::after{ background:#000; }
html[data-contrast="high"] .detail-media{ background:#000; border-color:#ffd257; color:#ffd257; }
html[data-contrast="high"] .detail-block h3{ color:#000; }
html[data-contrast="high"] .detail-block h3::before,
html[data-contrast="high"] .staff-note{ border-color:#000; }
html[data-contrast="high"] .staff-note{ background:#fff; color:#000; }
html[data-contrast="high"] .icon-btn{ background:#000; border-color:#fff; color:#fff; }
html[data-contrast="high"] .icon-btn[aria-pressed="true"]{ background:#ffd257; color:#000; border-color:#000; }
html[data-contrast="high"] .cta-begin{
  background:#ffd257; color:#000; border-color:#000;
  -webkit-text-fill-color:#000;
}
html[data-contrast="high"] .cta-begin::before{ background:#000; }
html[data-contrast="high"] .lang-menu{ background:#fff; border-color:#000; }
html[data-contrast="high"] .lang-menu button[aria-current="true"]{ background:#000; color:#fff; box-shadow:inset 0.16rem 0 0 #ffd257; }
html[data-contrast="high"] .lang-soon{ color:#000; opacity:1; }
html[data-contrast="high"] .swatch{ background:#fff; border-color:#000; color:#000; }
html[data-contrast="high"] .swatch[aria-pressed="true"]{ background:#ffd257; border-color:#000; }
/* muted text on WHITE cards -> near-black */
html[data-contrast="high"] .range-meta,
html[data-contrast="high"] .search-hint,
html[data-contrast="high"] .pending,
html[data-contrast="high"] .allergen-note,
html[data-contrast="high"] .detail-row dt{ color:#000; opacity:1; }
html[data-contrast="high"] .pending{ background:#fff; border:2px solid #000; }
/* muted text on the DARK app ground or the black tile -> white
   (these were previously set to #000, i.e. invisible on their bg) */
html[data-contrast="high"] .tile-blurb,
html[data-contrast="high"] .blend-list-header .meta,
html[data-contrast="high"] .section-heading p{ color:#fff; opacity:1; }
html[data-contrast="high"] .pill{ background:#000; color:#fff; border-color:#fff; }
html[data-contrast="high"] .pill.allergen{ background:#7a5408; color:#fff; border-color:#fff; }

/* ===== landscape reflow ===== */
@media (orientation:landscape){
  /* Only the Attract screen needs this: its content is centered via
     justify-content, so a little top padding just keeps it from
     visually crowding the corner language/accessibility buttons.
     Category/Blend screens have a real in-flow topbar instead and
     don't need (or want) extra top padding on top of that. */
  .screen-attract{ padding-top:4.4rem; }
  .tile-grid{ height:min(80vh, 34rem); }
  .card-grid{ max-width:64rem; }
  .attract-content{ flex-direction:row; gap:2.8rem; text-align:left; max-width:62rem; }
  .attract-content > div{ text-align:center; }
  .attract-content .cta-begin{ margin-top:0; }
  .wm{ font-size:clamp(2.4rem, 7vw, 4rem); }
  .tagline{ justify-content:center; }
}

/* small-height safety (landscape on the 8.7in tablet is short) */
@media (max-height:440px){
  .screen-attract{ padding-top:3.6rem; }
  .badge{ width:4.6rem; height:4.6rem; }
  .tile .badge{ width:6rem; height:6rem; }
  .wm{ font-size:clamp(2rem, 6vw, 3rem); }
  .wm-sprig{ width:2.6em; }
  .range-card{ min-height:0; }
  .wreath-medallion{ display:none; }
}

/* focus visibility for external keyboards / accessibility inspection —
   covers the div[role="button"] range cards too, not just <button> */
button:focus-visible,
[role="button"]:focus-visible,
input:focus-visible{ outline:3px solid var(--gold-400); outline-offset:2px; }
.range-card:focus-visible{ outline-offset:0.15rem; }

/* ===== reduced motion (MASTER §4/§8) =====
   Drop the decorative, non-essential motion — screen fade, snowfall,
   the Attract CTA shimmer, the search-result highlight pulse — and
   render every screen in its final state immediately. The short
   (<=180ms) :active press-feedback transitions are deliberately kept:
   they're functional tap feedback, which the design system asks for. */
@media (prefers-reduced-motion: reduce){
  .screen{ animation:none; opacity:1; transform:none; }
  .range-card, .blend-chip{ animation:none; opacity:1; transform:none; }
  .tile{ animation:none; opacity:1; }   /* keep the translate(-50%,-50%) centering */
  .wreath-medallion{ animation:none; opacity:1; }
  .lang-menu[data-open="true"],
  .search-overlay[data-open="true"]{ animation:none; }
  .snowfall{ display:none; }
  .cta-begin::after{ animation:none; opacity:0; }
}

::-webkit-scrollbar{ width:0.5rem; }
::-webkit-scrollbar-track{ background:transparent; }
::-webkit-scrollbar-thumb{ background:var(--gilt-soft); border-radius:999px; }
::-webkit-scrollbar-thumb:hover{ background:var(--gilt); }
</style>

/* ============================================================

   inactivity timeout) hands the kiosk to the *next* passenger,

   ============================================================ */
var searchOpen = false;
function openSearch(){ searchOpen = true; render(); requestAnimationFrame(function(){ var i=document.getElementById("search-input"); if(i) i.focus(); }); }
function closeSearch(){ searchOpen = false; render(); }
/* Matches against every language's name, not just the active one —
   a passenger might type in whatever language they know a flavour
   by, regardless of which language the kiosk is currently showing. */
function nameMatches(nameObj, q, qRaw){
  return Object.keys(nameObj).some(function(code){
    var v = nameObj[code];
    return v && v.toLowerCase().indexOf(q)>-1 || v===qRaw;
  });
}
function runSearch(qRaw){
  var q = (qRaw||"").trim().toLowerCase();
  if(!q) return [];
  var results = [];
  Object.keys(BLENDS).forEach(function(id){
    var b = BLENDS[id];
    if(nameMatches(b.name, q, qRaw.trim())){
      results.push({ type:"blend", id:id, label:blendName(b), sub:brewLabel(b) });
    }
  });
  RANGES.forEach(function(r){
    if(nameMatches(r.name, q, qRaw.trim()) || (r.style && r.style.toLowerCase().indexOf(q)>-1)){
      results.push({ type:"range", id:r.id, label:rangeName(r), sub:r.style });
    }
  });
  return results.slice(0,20);
}
function selectSearchResult(item){
  closeSearch();
  if(item.type==="blend"){
    go({ screen:"blend", rangeId:null, blendId:item.id });
  } else {
    go({ screen:"category", categoryId:RANGE_BY_ID[item.id].category, highlightRangeId:item.id });
    setTimeout(function(){
      var el = document.querySelector('[data-range-id="'+item.id+'"]');
      if(el){
        var smooth = !(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
        el.scrollIntoView({block:"center", behavior: smooth ? "smooth" : "auto"});
        el.classList.add("highlight"); setTimeout(function(){ el.classList.remove("highlight"); },2200);
      }
    },50);
  }
}

   RENDER
   ============================================================ */
var app = document.getElementById("app");

function render(){
  applyPrefsToDom();
  var html = "";
  if(state.screen==="attract"){
    html = renderAttract();
  } else {
    /* Wrapped in the same .screen flex column renderAttract() uses
       for itself, so `.screen-scroll{flex:1 1 auto}` inside it has
       an actual flex parent to grow into — without this wrapper it
       was just sizing to its own content and leaving the rest of
       the tall tablet viewport as dead space below it. */
    var body = renderTopbar();
    body += state.screen==="category" ? renderCategoryScreen() : renderBlendScreen();
    html = '<section class="screen">'+body+'</section>';
  }
  html += renderSearchOverlay();
  app.innerHTML = html;
  wireGlobalControls();
}

    }
  });
  return '<div class="snowfall" aria-hidden="true">'+flakes+'</div>';
}

/* ---- wordmark lockup: real type + drawn ornament ----
   SIP / THE / SEASON stacked and centred, gilded via CSS foil clip; a
   holly sprig above and hairline rules either side of the small tracked
   "THE". The whole visual block is aria-hidden; the container carries a
   single clean "Sip The Season" accessible name. Replaces the mangled
   PDF path trace (see design-system/.../brand-assets.md). */
var WM_SPRIG = '<svg class="wm-sprig" viewBox="0 0 128 34" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">'+
  '<path d="M64 31V15" stroke="#cb951a" stroke-width="1.8" stroke-linecap="round"/>'+
  '<path d="M64 22c-7 0-13-4-17-11 9-2 16 2 17 11z" fill="#27813a"/>'+
  '<path d="M64 22c7 0 13-4 17-11-9-2-16 2-17 11z" fill="#2e9d40"/>'+
  '<path d="M64 17c-4-3-6-8-6-14 5 2 8 8 6 14z" fill="#2e9d40"/>'+
  '<path d="M64 17c4-3 6-8 6-14-5 2-8 8-6 14z" fill="#27813a"/>'+
  '<circle cx="57.5" cy="25.5" r="2.6" fill="#a3213c"/><circle cx="64" cy="27.5" r="2.6" fill="#a3213c"/><circle cx="70.5" cy="25.5" r="2.6" fill="#a3213c"/>'+
  '<path d="M14 17h28M86 17h28" stroke="#cb951a" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="0.5 4.5"/>'+
  '<path d="M8 17l6-3v6zM120 17l-6-3v6z" fill="#cb951a"/>'+
'</svg>';
function renderWordmark(){
  return '<div class="wordmark" role="img" aria-label="Sip The Season">'+
    '<span class="wm" aria-hidden="true">'+
      WM_SPRIG+
      '<span class="wm-line wm-sip">SIP</span>'+
      '<span class="wm-the"><i></i>THE<i></i></span>'+
      '<span class="wm-line wm-season">SEASON</span>'+
    '</span>'+
  '</div>';
}

/* medallion at the centre of the Category wreath — beaded gilt ring,
   holly at 12 o'clock, a star at 6, a stylised teacup at the heart.
   Purely decorative (aria-hidden, pointer-events:none via CSS). */
function wreathMedallion(){
  var beads = "";
  for(var i=0;i<20;i++){
    var a = i/20*Math.PI*2;
    beads += '<circle cx="'+(60+50*Math.cos(a)).toFixed(1)+'" cy="'+(60+50*Math.sin(a)).toFixed(1)+'" r="1.5"/>';
  }
  return '<div class="wreath-medallion" aria-hidden="true">'+
    '<svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">'+
      '<circle cx="60" cy="60" r="54" stroke="#cb951a" stroke-width="1.4" stroke-opacity="0.55"/>'+
      '<g fill="#cb951a" fill-opacity="0.7">'+beads+'</g>'+
      '<path d="M60 15c-5 0-9-3-12-8 6-1 11 2 12 8z" fill="#27813a"/>'+
      '<path d="M60 15c5 0 9-3 12-8-6-1-11 2-12 8z" fill="#2e9d40"/>'+
      '<circle cx="57" cy="14.5" r="1.9" fill="#a3213c"/><circle cx="63" cy="14.5" r="1.9" fill="#a3213c"/>'+
      '<path d="M60 97l1.8 5.5 5.8.2-4.6 3.5 1.7 5.6L60 114l-4.7 2.8 1.7-5.6-4.6-3.5 5.8-.2z" fill="#e0b04a"/>'+
      '<path d="M45 60h28a14 14 0 0 1-28 0z" fill="#541232" stroke="#cb951a" stroke-width="2"/>'+
      '<path d="M73 62h4.5a5.5 5.5 0 0 1 0 11H74" stroke="#cb951a" stroke-width="2" fill="none"/>'+
      '<ellipse cx="59" cy="60" rx="14" ry="3.4" fill="#3a0e26" stroke="#cb951a" stroke-width="1.8"/>'+
      '<path d="M52 79h14" stroke="#cb951a" stroke-width="2" stroke-linecap="round"/>'+
      '<path d="M53 50q3.5-4 0-8M59 48q3.5-4 0-8M65 50q3.5-4 0-8" stroke="#e0b04a" stroke-width="2" stroke-linecap="round"/>'+
    '</svg>'+
  '</div>';
}

function renderAttract(){
  return ''+
  '<section class="screen screen-attract" data-action="begin">'+
    renderSnow()+
    '<div class="attract-glow" aria-hidden="true"></div>'+
    '<div class="ornament-frame" aria-hidden="true"><i></i><i></i><i></i><i></i></div>'+
    '<div class="attract-lang">'+ renderLangSwitch() +'</div>'+
    '<div class="attract-a11y">'+ renderA11yButtons() +'</div>'+
    '<div class="attract-content">'+
      '<div>'+
        renderWordmark()+
        '<p class="tagline">'+t("tagline")+'</p>'+
      '</div>'+
      '<button class="cta-begin" data-action="begin">'+t("tapBegin")+'</button>'+
    '</div>'+
  '</section>';
}

function renderTopbar(){
  var title = "";
  if(state.screen==="category" && state.categoryId){
    title = categoryName(CATEGORIES.filter(function(c){return c.id===state.categoryId;})[0]);
  } else if(state.screen==="blend"){
    if(state.blendId) title = blendName(BLENDS[state.blendId]);
    else if(state.rangeId) title = rangeName(RANGE_BY_ID[state.rangeId]);
  } else if(state.screen==="category"){
    title = t("chooseCategory");
  }
  return ''+
  '<header class="topbar">'+
    (history_.length ? '<button class="icon-btn back-btn" data-action="back" aria-label="'+t("back")+'">'+UI_ICONS.back+'<span>'+t("back")+'</span></button>' : '<span style="width:0.2rem"></span>')+
    '<div class="spacer topbar-title">'+escapeHtml(title)+'</div>'+
    '<div class="topbar-controls">'+
      '<button class="icon-btn" data-action="open-search" aria-label="'+t("search")+'">'+UI_ICONS.search+'</button>'+
      renderLangSwitch()+
      renderA11yButtons()+
    '</div>'+
  '</header>';
}

function renderA11yButtons(){
  return ''+
    '<button class="icon-btn" data-action="cycle-textsize" aria-label="'+t("textSize")+'">Aa</button>'+
    '<button class="icon-btn" data-action="toggle-contrast" aria-pressed="'+state.contrast+'" aria-label="'+t("contrast")+'">'+UI_ICONS.contrast+'</button>';
}

function renderLangSwitch(){
  var current = LANGS.filter(function(l){return l.code===state.lang;})[0];
  var items = LANGS.map(function(l){
    return '<button role="menuitemradio" aria-current="'+(l.code===state.lang)+'" aria-disabled="'+(!l.ready)+'" data-action="'+(l.ready?'set-lang':'lang-soon')+'" data-lang="'+l.code+'">'+
      '<span>'+l.label+'</span>'+ (l.ready? '' : '<span class="lang-soon">'+t("comingSoon")+'</span>') +
    '</button>';
  }).join("");
  return ''+
  '<div class="lang-switch">'+
    '<button class="icon-btn" data-action="toggle-lang-menu" aria-label="'+t("language")+'" aria-haspopup="true">'+UI_ICONS.globe+'<span>'+current.code.toUpperCase()+'</span></button>'+
    '<div class="lang-menu" role="menu" data-open="false">'+items+'</div>'+
  '</div>';
}

function renderCategoryScreen(){
  if(!state.categoryId){
    var tiles = CATEGORIES.map(function(c){
      return '<button class="tile" data-action="open-category" data-id="'+c.id+'">'+
        '<span class="badge">'+ART[c.id]+'</span>'+
        '<span class="tile-text">'+
          '<span class="tile-name">'+categoryName(c)+'</span>'+
          '<span class="tile-blurb">'+categoryBlurb(c)+'</span>'+
        '</span>'+
      '</button>';
    }).join("");
    return ''+
    '<div class="section-heading"><h2>'+t("chooseCategory")+'</h2></div>'+
    '<div class="screen-scroll"><div class="tile-grid">'+wreathMedallion()+tiles+'</div></div>';
  }
  var cat = CATEGORIES.filter(function(c){return c.id===state.categoryId;})[0];
  var ranges = RANGES.filter(function(r){return r.category===state.categoryId;});
  var cards = ranges.map(renderRangeCard).join("");
  return ''+
  '<div class="section-heading"><h2>'+categoryName(cat)+'</h2></div>'+
  '<div class="screen-scroll"><div class="card-grid">'+cards+'</div></div>';
}

function renderRangeCard(r){
  /* A plain <div role="button"> on purpose, not a <button>: this
     card contains its own nested swatch <button>s for Stockings,
     and a <button> inside a <button> is invalid HTML — browsers
     silently close the outer button early, which was breaking the
     whole grid's layout. Enter/Space activation is wired manually
     below (see the keydown handler near the click delegation). */
  var ring = ringClass(r.ring);
  var swatches = "";
  if(r.variants){
    swatches = '<div class="swatch-row">'+ r.variants.map(function(v){
      var pressed = state.stockingsColor===v.id;
      return '<button class="swatch" aria-pressed="'+pressed+'" data-action="select-variant" data-range-id="'+r.id+'" data-variant="'+v.id+'">'+
        '<span class="swatch-dot" style="background:'+v.hex+'"></span>'+colorLabel(v.id)+
      '</button>';
    }).join("") + '</div>';
  }
  var rName = rangeName(r), rFmt = rangeFormat(r);
  var label = rName+(r.variants?(' — '+colorLabel(state.stockingsColor)):'')+', '+rFmt+', '+t("blendsInside")(r.blends.length);
  return ''+
  '<div class="range-card '+ring+'" role="button" tabindex="0" aria-label="'+escapeHtml(label)+'" data-action="open-range" data-id="'+r.id+'" data-range-id="'+r.id+'">'+
    '<span class="badge">'+ART[r.icon]+'</span>'+
    '<span class="range-body">'+
      '<span class="range-name">'+rName+(r.variants?(' — '+colorLabel(state.stockingsColor)):'')+'</span>'+
      '<span class="range-meta">'+rFmt+' · '+r.pack+' · '+t("blendsInside")(r.blends.length)+'</span>'+
      swatches+
    '</span>'+
  '</div>';
}

function renderBlendScreen(){
  if(state.blendId){
    return renderBlendDetail(state.blendId);
  }
  var range = RANGE_BY_ID[state.rangeId];
  if(!range){ return '<div class="screen-scroll"><p style="color:#fff">Range not found.</p></div>'; }
  var colourSuffix = range.variants ? (" — "+colorLabel(state.stockingsColor)+" "+t("colourway")) : "";
  var chips = range.blends.map(function(bid){
    var b = BLENDS[bid];
    var allergen = allergenLabel(b);
    return '<button class="blend-chip" data-action="open-blend" data-id="'+bid+'">'+
      '<span class="name-en">'+blendName(b)+'</span>'+
      '<span class="chip-meta"><span class="pill">'+brewLabel(b)+'</span>'+(allergen?'<span class="pill allergen">'+allergen+'</span>':'')+'</span>'+
    '</button>';
  }).join("");
  var variantRow = range.variants ? ('<div class="swatch-row" style="margin-bottom:0.6rem">'+ range.variants.map(function(v){
      var pressed = state.stockingsColor===v.id;
      return '<button class="swatch" aria-pressed="'+pressed+'" data-action="select-variant" data-range-id="'+range.id+'" data-variant="'+v.id+'">'+
        '<span class="swatch-dot" style="background:'+v.hex+'"></span>'+colorLabel(v.id)+
      '</button>';
    }).join("")+'</div>') : "";
  return ''+
  '<div class="blend-list-header">'+
    '<h2>'+rangeName(range)+colourSuffix+'</h2>'+
    '<div class="meta">'+rangeFormat(range)+' · '+range.pack+' · '+t("styleLabel")+' '+range.style+'</div>'+
  '</div>'+
  '<div class="screen-scroll">'+variantRow+'<div class="blend-chip-grid">'+chips+'</div></div>';
}

function renderBlendDetail(bid){
  var b = BLENDS[bid];
  var ing = ingredientList(bid);
  var ingBlock = ing
    ? '<p class="ingredients-body">'+escapeHtml(ing)+'</p>'
    : '<div class="pending">'+t("pendingIngredients")+'</div>';
  return ''+
  '<div class="screen-scroll">'+
    '<div class="detail-card">'+
      '<div class="detail-media">'+ICONS.photo+'<span>'+t("pendingImage")+'</span></div>'+
      '<h2 class="detail-title-en">'+blendName(b)+'</h2>'+
      '<dl>'+
        '<div class="detail-row"><dt>'+t("brewTime")+'</dt><dd>'+brewLabel(b)+'</dd></div>'+
        '<div class="detail-row"><dt>'+t("allergenInfo")+'</dt><dd>'+(allergenLabel(b) || "—")+'</dd></div>'+
        '<div class="detail-row"><dt>'+t("price")+'</dt><dd>'+t("pendingPrice")+'</dd></div>'+
      '</dl>'+
      '<div class="detail-block"><h3>'+t("tastingNotes")+'</h3><div class="pending">'+t("pendingCopy")+'</div></div>'+
      '<div class="detail-block"><h3>'+t("ingredients")+'</h3>'+ingBlock+'</div>'+
      '<div class="detail-block"><h3>'+t("cupColour")+'</h3><div class="pending">'+ICONS.cup.replace(/#f8f2e2/g,"#6b5560")+t("pendingCup")+'</div></div>'+
      '<div class="allergen-note staff-note">'+t("askStaff")+'</div>'+
    '</div>'+
  '</div>';
}

function renderSearchOverlay(){
  if(!searchOpen) return "";
  return ''+
  '<div class="search-overlay" data-open="true" role="dialog" aria-label="'+t("search")+'">'+
    '<div class="search-panel">'+
      '<div class="search-input-row">'+
        '<input id="search-input" type="text" inputmode="search" placeholder="'+t("searchPlaceholder")+'" autocomplete="off" />'+
        '<button class="icon-btn" data-action="close-search" aria-label="'+t("close")+'">'+UI_ICONS.close+'</button>'+
      '</div>'+
      '<div class="search-hint">'+t("searchHint")+'</div>'+
      '<div class="search-results" id="search-results"></div>'+
    '</div>'+
  '</div>';
}

function renderSearchResults(items){
  var box = document.getElementById("search-results");
  if(!box) return;
  if(!items.length){
    box.innerHTML = '<div class="search-hint">'+t("noResults")+'</div>';
    return;
  }
  box.innerHTML = items.map(function(it,idx){
    return '<button class="search-result" data-action="pick-result" data-index="'+idx+'">'+
      '<div class="sr-type">'+(it.type==="blend"?t("blendResult"):t("rangeResult"))+'</div>'+
      '<div>'+escapeHtml(it.label)+(it.sub?' <span style="opacity:.6">· '+escapeHtml(it.sub)+'</span>':'')+'</div>'+
    '</button>';
  }).join("");
  box.__items = items;
}

/* ---------- helpers ---------- */
function escapeHtml(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]; }); }

/* ============================================================
   EVENT WIRING (delegated)
   ============================================================ */
function wireGlobalControls(){
  var input = document.getElementById("search-input");
  if(input){
    input.addEventListener("input", function(){ renderSearchResults(runSearch(input.value)); });
  }
}

app.addEventListener("click", function(e){
  /* An open language menu (or the search overlay) eats the very next
     tap to close itself — it must not ALSO fall through to whatever
     data-action sits underneath (e.g. the attract screen's whole-
     screen "tap anywhere to begin", which would otherwise both close
     the menu and silently start the app on the same tap). */
  var openMenu = document.querySelector('.lang-menu[data-open="true"]');
  if(openMenu && !e.target.closest(".lang-switch")){
    openMenu.setAttribute("data-open","false");
    e.stopPropagation();
    return;
  }
  if(e.target.classList.contains("search-overlay")){
    closeSearch();
    return;
  }

  var el = e.target.closest("[data-action]");
  if(!el) return;
  var action = el.getAttribute("data-action");
  resetInactivity();

  switch(action){
    case "begin":
      go({ screen:"category" });
      break;
    case "back":
      goBack();
      break;
    case "open-category":
      go({ screen:"category", categoryId: el.getAttribute("data-id") });
      break;
    case "open-range": {
      var rid = el.getAttribute("data-id");
      go({ screen:"blend", rangeId: rid, blendId:null });
      break;
    }
    case "open-blend":
      go({ screen:"blend", blendId: el.getAttribute("data-id") });
      break;
    case "select-variant":
      state.stockingsColor = el.getAttribute("data-variant");
      e.stopPropagation();
      render();
      break;
    case "open-search":
      openSearch();
      break;
    case "close-search":
      closeSearch();
      break;
    case "pick-result": {
      var box = document.getElementById("search-results");
      var idx = parseInt(el.getAttribute("data-index"),10);
      var item = box && box.__items && box.__items[idx];
      if(item) selectSearchResult(item);
      break;
    }
    case "toggle-lang-menu": {
      var menu = el.parentElement.querySelector(".lang-menu");
      var isOpen = menu.getAttribute("data-open") === "true";
      document.querySelectorAll(".lang-menu").forEach(function(m){ m.setAttribute("data-open","false"); });
      menu.setAttribute("data-open", String(!isOpen));
      e.stopPropagation();
      break;
    }
    case "set-lang":
      setLang(el.getAttribute("data-lang"));
      break;
    case "lang-soon":
      announce(el.textContent.trim() + " is not available yet.");
      break;
    case "cycle-textsize":
      cycleTextSize();
      break;
    case "toggle-contrast":
      toggleContrast();
      break;
  }
});

/* Enter/Space activates the div[role="button"] range cards the same
   way a native <button> already handles those keys for free — see
   the comment in renderRangeCard() for why they can't be real
   <button> elements. Re-dispatching a click lets the one switch-case
   above stay the single source of truth for what each action does. */
app.addEventListener("keydown", function(e){
  if(e.key !== "Enter" && e.key !== " " && e.key !== "Spacebar") return;
  var el = e.target.closest('[role="button"][data-action]');
  if(!el) return;
  e.preventDefault();
  el.click();
});

/* Escape backs out of search or the current screen */
document.addEventListener("keydown", function(e){
  if(e.key === "Escape"){
    if(searchOpen) closeSearch();
    else if(history_.length) goBack();
  }
});
["pointerdown","keydown"].forEach(function(evt){
  document.addEventListener(evt, resetInactivity, {passive:true});
});

/* ---------- init ---------- */
applyPrefsToDom();
render();

})();
</script>
