<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Sip The Season</title>
<style>
/* ============================================================
   SIP THE SEASON — BIA store kiosk
   Placeholder-asset build. See BUILD_NOTES.md alongside this
   file for exactly what is spec-final vs. placeholder.
   ============================================================ */

:root{
  --wine-900:#3a0e26;
  --wine-800:#4a1030;
  --wine-700:#541232;
  --gold-600:#cb951a;
  --gold-400:#e0b04a;
  --cream-050:#f8f2e2;
  --cream-100:#fbf6ea;
  --green-600:#27813a;
  --green-500:#2e9d40;
  --pink-300:#e6afcb;
  --navy-500:#2f5d8a;
  --ink:#2a1018;

  --radius-lg:1.4rem;
  --radius-md:1rem;
  --radius-sm:0.6rem;

  --shadow-soft:0 0.6rem 1.6rem rgba(20,4,12,0.28), 0 0.15rem 0.4rem rgba(20,4,12,0.18);
  --shadow-lift:0 1rem 2.4rem rgba(20,4,12,0.34), 0 0.25rem 0.6rem rgba(20,4,12,0.2);

  /* spacing scale — design-system/sip-the-season/MASTER.md §4 (Spacious).
     --space-sm is also the minimum gap between two touch targets. */
  --space-xs:0.25rem;
  --space-sm:0.5rem;
  --space-md:1.5rem;
  --space-lg:2rem;
  --space-xl:3rem;
  --space-2xl:4rem;

  --tap-min:3.6rem;
  --dur-fast:180ms;
  --dur-med:320ms;
  /* decelerate on arrival, gentle standard curve for state changes
     (design-system MASTER §4 — motion is subtle, meaning-carrying) */
  --ease-out:cubic-bezier(0.16,1,0.3,1);
  --ease-std:cubic-bezier(0.4,0,0.2,1);
}

html[data-textsize="normal"]{ font-size:16px; }
html[data-textsize="large"]{ font-size:19px; }
html[data-textsize="xlarge"]{ font-size:23px; }

*,*::before,*::after{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0;
  font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color:var(--ink);
  background:var(--wine-900);
  overflow:hidden;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}
h1,h2,h3{
  font-family:"Iowan Old Style","Palatino Linotype","Book Antiqua",Georgia,"Noto Serif JP",serif;
  margin:0;
  font-weight:600;
}
button{ font:inherit; color:inherit; }
img,svg{ display:block; }

/* ---------- app shell ---------- */
#app{
  position:relative;
  height:100vh;
  height:100dvh;
  width:100vw;
  overflow:hidden;
  background:
    radial-gradient(80% 60% at 50% 8%, var(--wine-700) 0%, var(--wine-900) 62%),
    var(--wine-900);
}
/* subtle static grain for warmth — one background-image, no runtime cost */
#app::after{
  content:"";
  position:absolute; inset:0;
  pointer-events:none;
  opacity:0.05;
  mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  background-size:180px 180px;
}
html[data-contrast="high"] #app::after{ display:none; }

#live-region{
  position:absolute; width:1px; height:1px; overflow:hidden;
  clip:rect(0 0 0 0); white-space:nowrap;
}

/* ---------- topbar ---------- */
.topbar{
  position:relative;
  z-index:20;
  display:flex;
  align-items:center;
  gap:0.6rem;
  padding:0.9rem 1rem;
  color:var(--cream-100);
}
.topbar .spacer{ flex:1 1 auto; min-width:0; }
.topbar-title{
  font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;
  font-size:1.05rem;
  letter-spacing:0.02em;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  opacity:0.92;
}
.icon-btn{
  min-width:var(--tap-min);
  min-height:var(--tap-min);
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:0.35rem;
  padding:0 0.9rem;
  background:rgba(248,242,226,0.1);
  border:1px solid rgba(248,242,226,0.28);
  border-radius:999px;
  cursor:pointer;
  font-size:1rem;
  line-height:1;
  transition:background var(--dur-fast) ease, transform var(--dur-fast) ease;
}
.icon-btn:hover{ background:rgba(248,242,226,0.18); }
.icon-btn:active{ transform:scale(0.96); }
.icon-btn[aria-pressed="true"]{ background:var(--gold-600); color:var(--wine-900); border-color:var(--gold-600); }
.icon-btn.back-btn{ padding:0 1.1rem 0 0.8rem; }
/* chrome icons are inline SVG (no emoji — MASTER §9): stroke inherits
   the button's `color`, so they track cream-on-wine, wine-on-gold when
   pressed, and white in high-contrast mode automatically. */
.icon-btn svg{ width:1.3rem; height:1.3rem; flex-shrink:0; }
.topbar-controls{ display:flex; align-items:center; gap:0.5rem; flex-wrap:nowrap; }

/* language switcher */
.lang-switch{ position:relative; }
.lang-menu{
  position:absolute; top:calc(100% + 0.5rem); right:0;
  background:var(--cream-100);
  color:var(--ink);
  border-radius:var(--radius-md);
  box-shadow:var(--shadow-lift);
  padding:0.4rem;
  display:none;
  min-width:11rem;
  z-index:40;
}
.lang-menu[data-open="true"]{ display:block; }
.lang-menu button{
  display:flex; width:100%; align-items:center; justify-content:space-between;
  min-height:2.8rem; padding:0 0.8rem; border:0; background:transparent;
  border-radius:var(--radius-sm); cursor:pointer; font-size:0.95rem;
}
.lang-menu button:hover{ background:rgba(58,14,38,0.08); }
.lang-menu button[aria-disabled="true"]{ opacity:0.45; cursor:default; }
.lang-menu button[aria-current="true"]{ background:var(--wine-700); color:var(--cream-100); }
.lang-soon{ font-size:0.7rem; text-transform:uppercase; letter-spacing:0.04em; opacity:0.75; }

/* ---------- screens ---------- */
.screen{
  position:absolute; inset:0;
  display:flex; flex-direction:column;
  opacity:0; transform:translateY(0.6rem);
  animation:screen-in var(--dur-med) var(--ease-out) forwards;
  overflow:hidden;
}
@keyframes screen-in{ to{ opacity:1; transform:translateY(0); } }

/* Staggered card entrance — a small fade+rise per item so a list
   assembles rather than snapping in (design-system: Stagger List,
   Subtle tier — ~40ms/item, 8-16px rise). Disabled under reduced
   motion further down. */
@keyframes card-in{ from{ opacity:0; transform:translateY(0.7rem); } to{ opacity:1; transform:translateY(0); } }
/* tiles are absolutely positioned with translate(-50%,-50%); a transform
   keyframe would fight that, so they fade only */
@keyframes tile-in{ from{ opacity:0; } to{ opacity:1; } }
.range-card, .blend-chip{ animation:card-in 360ms var(--ease-out) both; }
.tile{ animation:tile-in 380ms var(--ease-out) both; }
.tile:nth-child(2){ animation-delay:70ms; }
.tile:nth-child(3){ animation-delay:140ms; }
.card-grid > *:nth-child(1), .blend-chip-grid > *:nth-child(1){ animation-delay:40ms; }
.card-grid > *:nth-child(2), .blend-chip-grid > *:nth-child(2){ animation-delay:80ms; }
.card-grid > *:nth-child(3), .blend-chip-grid > *:nth-child(3){ animation-delay:120ms; }
.card-grid > *:nth-child(4), .blend-chip-grid > *:nth-child(4){ animation-delay:160ms; }
.card-grid > *:nth-child(5), .blend-chip-grid > *:nth-child(5){ animation-delay:200ms; }
.card-grid > *:nth-child(n+6), .blend-chip-grid > *:nth-child(n+6){ animation-delay:240ms; }
/* `safe center`: a short list (e.g. a 2-card category, or a 3-blend
   Range) centers in the available space instead of sitting pinned
   to the top with a dead zone below it; a long one that overflows
   falls back to start-aligned so the top of the list is never
   scrolled-past-reach. Chrome/Safari on the target tablet both
   support `safe`; older engines just treat it as plain `center`,
   which is still fine for the short lists that are the common case. */
.screen-scroll{
  flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch;
  padding:0 1.3rem 2.5rem;
  display:flex; flex-direction:column; justify-content:safe center; gap:1.5rem;
}

/* ===== Attract ===== */
.screen-attract{ align-items:center; justify-content:center; text-align:center; }
.snowfall{ position:absolute; inset:0; overflow:hidden; pointer-events:none; }
.snowflake{
  position:absolute; top:-5%; color:var(--cream-050); opacity:0.75; will-change:transform;
  animation-name:snow-fall; animation-timing-function:linear; animation-iteration-count:infinite;
}
@keyframes snow-fall{
  0%{ transform:translate3d(0,-10vh,0) rotate(0deg); }
  100%{ transform:translate3d(var(--drift,2rem),115vh,0) rotate(180deg); }
}
.attract-glow{
  position:absolute; left:50%; top:32%; width:26rem; height:26rem; transform:translate(-50%,-50%);
  background:radial-gradient(circle, rgba(224,176,74,0.35) 0%, rgba(224,176,74,0) 68%);
  pointer-events:none;
}
.attract-content{ position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; gap:1.35rem; padding:0 1.5rem; }
/* Real STS wordmark (SVG). The gold is the artwork's own; a soft drop
   shadow lifts it off the wine ground. */
.wordmark{ width:min(78vw, 30rem); margin:0; filter:drop-shadow(0 0.15rem 0.9rem rgba(20,4,12,0.45)); }
.wordmark svg{ display:block; width:100%; height:auto; }
.tagline{ color:var(--cream-050); opacity:0.85; letter-spacing:0.18em; text-transform:uppercase; font-size:0.8rem; margin:0.2rem 0 0; }
.cta-begin{
  margin-top:1.4rem;
  min-height:4rem;
  padding:0 2.2rem;
  border-radius:999px;
  border:1px solid var(--gold-400);
  background:transparent;
  color:var(--gold-400);
  font-size:1.05rem;
  letter-spacing:0.06em;
  text-transform:uppercase;
  cursor:pointer;
  position:relative;
  overflow:hidden;
}
.cta-begin::after{
  content:""; position:absolute; inset:0; border-radius:inherit;
  background:linear-gradient(100deg, transparent 40%, rgba(224,176,74,0.35) 50%, transparent 60%);
  transform:translateX(-120%);
  animation:shimmer 3.2s ease-in-out infinite;
}
@keyframes shimmer{ 0%,60%{ transform:translateX(-120%);} 100%{ transform:translateX(120%);} }
.attract-a11y{ position:absolute; top:0.9rem; right:0.9rem; display:flex; gap:0.5rem; z-index:5; }
.attract-lang{ position:absolute; top:0.9rem; left:0.9rem; z-index:5; }
/* Attract has no .topbar to inherit a light `color` from — set it here
   so the corner chrome icons (and the "Aa" label) read on the dark ground. */
.attract-a11y .icon-btn, .attract-lang > .lang-switch > .icon-btn{ color:var(--cream-100); }
/* The dropdown default anchors right:0, which is correct when its
   trigger sits near the topbar's right edge — but on the Attract
   screen the trigger sits at top-LEFT instead, so a right-anchored
   panel would spill off the left edge of the viewport. Anchor from
   the left there instead. */
.attract-lang .lang-menu{ right:auto; left:0; }

/* ===== Category ===== */
.section-heading{ color:var(--cream-100); padding:0 1.3rem 1rem; }
.section-heading h2{ font-size:1.7rem; }
.section-heading p{ margin:0.25rem 0 0; opacity:0.75; font-size:0.9rem; }
/* Exactly 3 categories, permanently (PRD §1) — arranged around a
   circle rather than a grid row, echoing a wreath. nth-child is safe
   here because CATEGORIES.map() always emits them in the same fixed
   order. Sized off both vw and vh (capped by an rem ceiling) so it
   fills most of the screen on the tall portrait tablet without
   overrunning a short landscape one — see the note on `.badge` below
   for the standalone short-landscape safety net. */
.tile-grid{
  position:relative;
  /* Deliberately not square: width stays safely inside the portrait
     tablet's viewport, while height is allowed to stretch much
     taller to actually use the screen instead of leaving a dead
     zone below a small centered cluster. */
  width:min(92vw, 44rem);
  height:min(80vh, 56rem);
  margin:0.5rem auto 0;
}
.tile{
  position:absolute;
  width:40%;
  transform:translate(-50%,-50%);
  background:linear-gradient(165deg, rgba(248,242,226,0.14), rgba(248,242,226,0.05));
  border:1px solid rgba(248,242,226,0.22);
  border-radius:var(--radius-lg);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1rem;
  color:var(--cream-100);
  cursor:pointer;
  padding:1.6rem 1.1rem;
  box-shadow:var(--shadow-soft);
  transition:transform var(--dur-fast) ease, background var(--dur-fast) ease;
}
.tile:nth-child(1){ left:50%; top:19%; }
.tile:nth-child(2){ left:78%; top:78%; }
.tile:nth-child(3){ left:22%; top:78%; }
.tile:active{ transform:translate(-50%,-50%) scale(0.97); }
.badge{
  width:6.6rem; height:6.6rem; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, var(--cream-100), var(--cream-050) 60%, #ecdfc0 100%);
  border:0.16rem solid var(--gold-600);
  display:flex; align-items:center; justify-content:center;
  box-shadow:inset 0 0.1rem 0.3rem rgba(255,255,255,0.6), 0 0.35rem 0.7rem rgba(20,4,12,0.35);
  flex-shrink:0;
}
/* Brand illustrations have varied aspect ratios — contain within the
   circle, keep proportions, let a tall detail (the ornament loop) sit
   just proud of the ring. */
.badge svg{ width:auto; height:auto; max-width:74%; max-height:88%; }
/* The 3 hero category tiles read as the headline choice on this
   screen, so their badge is noticeably bigger than the same badge
   reused inside a Range-grid list card (below). */
.tile .badge{ width:10.5rem; height:10.5rem; }
.tile .badge svg{ max-width:76%; max-height:90%; }
.tile-name{ font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif; font-size:1.55rem; letter-spacing:0.02em; }
.tile-blurb{ font-size:0.9rem; opacity:0.78; text-align:center; }

/* ===== Range grid ===== */
.card-grid{
  display:grid; gap:1.4rem;
  grid-template-columns:repeat(auto-fit, minmax(19rem, 1fr));
}
.range-card{
  background:var(--cream-100);
  border:1px solid rgba(58,14,38,0.12);
  border-radius:var(--radius-lg);
  padding:1.5rem;
  display:flex; align-items:center; gap:1.3rem;
  text-align:left;
  cursor:pointer;
  box-shadow:var(--shadow-soft);
  min-height:10rem;
  transition:transform var(--dur-fast) ease, box-shadow var(--dur-fast) ease;
}
.range-card:active{ transform:scale(0.98); }
.range-card.badge-ring-red .badge{ border-color:#a3213c; }
.range-card.badge-ring-green .badge{ border-color:var(--green-600); }
.range-card.badge-ring-white .badge{ border-color:var(--wine-700); background:radial-gradient(circle at 35% 30%,#fff,var(--cream-050) 70%); }
.range-card.badge-ring-blue .badge{ border-color:var(--navy-500); }
.range-card.highlight{ outline:0.2rem solid var(--gold-600); outline-offset:0.2rem; }
.range-body{ min-width:0; flex:1 1 auto; display:flex; flex-direction:column; }
.range-name{ font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif; font-size:1.3rem; color:var(--wine-900); line-height:1.25; }
.range-meta{ font-size:0.92rem; color:#6b5560; margin-top:0.3rem; }
.swatch-row{ display:flex; flex-wrap:wrap; gap:0.6rem; margin-top:0.7rem; }
.swatch{
  display:inline-flex; align-items:center; gap:0.4rem;
  min-height:2.6rem; padding:0 0.75rem 0 0.4rem;
  border-radius:999px; border:1px solid rgba(58,14,38,0.25);
  background:#fff; cursor:pointer; font-size:0.82rem; color:var(--ink);
}
/* Opaque, not translucent — this pill sits on both a cream card
   (range grid) and the dark wine page background (blend list), and
   a semi-transparent fill read fine on cream but went low-contrast
   dark-on-dark on wine. A solid fill is legible on both. */
.swatch[aria-pressed="true"]{ border-color:var(--wine-900); background:var(--gold-400); color:var(--wine-900); font-weight:700; }
.swatch-dot{ width:1rem; height:1rem; border-radius:50%; border:1px solid rgba(0,0,0,0.25); flex-shrink:0; }

/* ===== Blend list ===== */
.blend-list-header{ padding:0 1.3rem 0.4rem; color:var(--cream-100); }
.blend-list-header h2{ font-size:1.65rem; }
.blend-list-header .meta{ opacity:0.75; font-size:0.98rem; margin-top:0.25rem; }
.blend-chip-grid{ display:grid; gap:1.1rem; grid-template-columns:repeat(auto-fit, minmax(17rem,1fr)); }
.blend-chip{
  background:var(--cream-100); border-radius:var(--radius-md); border:1px solid rgba(58,14,38,0.12);
  padding:1.3rem 1.4rem; text-align:left; cursor:pointer; min-height:6.2rem;
  display:flex; flex-direction:column; justify-content:center; gap:0.3rem; box-shadow:var(--shadow-soft);
}
.blend-chip:active{ transform:scale(0.98); }
.blend-chip .name-en{ font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif; font-size:1.2rem; color:var(--wine-900); }
.blend-chip .chip-meta{ display:flex; gap:0.6rem; margin-top:0.35rem; flex-wrap:wrap; }
.pill{ font-size:0.78rem; padding:0.28rem 0.7rem; border-radius:999px; background:rgba(58,14,38,0.08); color:var(--wine-900); }
.pill.allergen{ background:rgba(203,149,26,0.18); color:#7a5a08; }

/* ===== Blend detail ===== */
.detail-card{
  background:var(--cream-100); border-radius:var(--radius-lg); padding:2rem;
  box-shadow:var(--shadow-lift); max-width:42rem; margin:0 auto; color:var(--ink);
}
.detail-media{
  height:14rem; border-radius:var(--radius-md); margin-bottom:1.2rem;
  background:linear-gradient(155deg, var(--wine-700), var(--wine-900));
  display:flex; align-items:center; justify-content:center; color:var(--cream-050);
  font-size:0.95rem; text-align:center; padding:1rem; gap:0.5rem; flex-direction:column;
  border:1px dashed rgba(224,176,74,0.6);
}
.detail-media svg{ width:4.2rem; height:4.2rem; opacity:0.85; }
.detail-title-en{ font-size:1.85rem; }
.detail-row{ display:flex; justify-content:space-between; gap:1rem; padding:0.85rem 0; border-top:1px solid rgba(58,14,38,0.1); font-size:1.05rem; }
.detail-row dt{ color:#6b5560; font-weight:600; }
.detail-row dd{ margin:0; text-align:right; max-width:60%; }
.detail-block{ margin-top:0.9rem; }
.detail-block h3{ font-size:0.95rem; text-transform:uppercase; letter-spacing:0.04em; color:var(--wine-700); margin-bottom:0.4rem; }
.pending{
  border:1px dashed rgba(58,14,38,0.3); border-radius:var(--radius-sm);
  padding:0.85rem 1rem; font-size:0.95rem; color:#6b5560; font-style:italic; background:rgba(58,14,38,0.03);
}
/* real ingredient copy — content-driven height, unitless line-height so it
   survives the text-size cycle in every language (MASTER §8 text reflow) */
.ingredients-body{ margin:0; font-size:0.95rem; line-height:1.55; color:var(--ink); }
html[data-contrast="high"] .ingredients-body{ color:#000; }
.allergen-note{ font-size:0.9rem; color:#6b5560; margin-top:0.4rem; }
.staff-note{ font-size:0.92rem; color:var(--wine-700); background:rgba(203,149,26,0.15); border-radius:var(--radius-sm); padding:0.75rem 0.9rem; margin-top:1.2rem; }

/* ===== search overlay ===== */
.search-overlay{
  position:absolute; inset:0; z-index:50; background:rgba(20,4,12,0.55);
  display:none; align-items:flex-start; justify-content:center; padding:4.5rem 1rem 1rem;
}
.search-overlay[data-open="true"]{ display:flex; }
.search-panel{ background:var(--cream-100); width:100%; max-width:32rem; border-radius:var(--radius-lg); box-shadow:var(--shadow-lift); padding:1rem; max-height:80vh; display:flex; flex-direction:column; }
.search-input-row{ display:flex; gap:0.5rem; }
.search-input-row input{
  flex:1; min-height:3.2rem; border-radius:999px; border:1px solid rgba(58,14,38,0.25);
  padding:0 1.1rem; font-size:1rem; background:#fff; color:var(--ink);
}
.search-input-row input:focus{ outline:2px solid var(--gold-600); }
.search-results{ margin-top:0.8rem; overflow-y:auto; display:flex; flex-direction:column; gap:0.4rem; }
.search-result{
  text-align:left; border:0; background:rgba(58,14,38,0.05); border-radius:var(--radius-sm);
  padding:0.7rem 0.9rem; cursor:pointer; min-height:3rem;
}
.search-result:hover{ background:rgba(58,14,38,0.1); }
.search-result .sr-type{ font-size:0.68rem; text-transform:uppercase; letter-spacing:0.04em; color:var(--gold-600); }
.search-hint{ font-size:0.78rem; color:#6b5560; padding:0.6rem 0.2rem 0; }

/* ===== high contrast overrides ===== */
html[data-contrast="high"] #app{ background:#180208; }
html[data-contrast="high"] .screen-category .section-heading,
html[data-contrast="high"] .blend-list-header,
html[data-contrast="high"] .topbar,
html[data-contrast="high"] .tagline,
html[data-contrast="high"] .tile{ color:#fff; }
html[data-contrast="high"] .tile{ background:#000; border-color:#fff; }
html[data-contrast="high"] .badge{ background:#fff; border-color:#ffd257; }
html[data-contrast="high"] .range-card,
html[data-contrast="high"] .blend-chip,
html[data-contrast="high"] .detail-card,
html[data-contrast="high"] .search-panel{ background:#fff; border:2px solid #000; box-shadow:none; }
html[data-contrast="high"] .range-name,
html[data-contrast="high"] .detail-title-en{ color:#000; }
html[data-contrast="high"] .wordmark{ filter:none; }
html[data-contrast="high"] .wordmark svg path{ fill:#ffd257; }
html[data-contrast="high"] .icon-btn{ background:#000; border-color:#fff; }
html[data-contrast="high"] .cta-begin{ border-color:#ffd257; color:#ffd257; }
/* muted text on WHITE cards -> near-black */
html[data-contrast="high"] .range-meta,
html[data-contrast="high"] .search-hint,
html[data-contrast="high"] .pending,
html[data-contrast="high"] .detail-row dt,
html[data-contrast="high"] .detail-row dd{ color:#000; opacity:1; }
/* muted text on the DARK app ground or the black tile -> white
   (these were previously set to #000, i.e. invisible on their bg) */
html[data-contrast="high"] .tile-blurb,
html[data-contrast="high"] .blend-list-header .meta,
html[data-contrast="high"] .section-heading p{ color:#fff; opacity:1; }
html[data-contrast="high"] .pill{ background:#000; color:#fff; }
html[data-contrast="high"] .pill.allergen{ background:#7a5a08; color:#fff; }

/* ===== landscape reflow ===== */
@media (orientation:landscape){
  /* Only the Attract screen needs this: its content is centered via
     justify-content, so a little top padding just keeps it from
     visually crowding the corner language/accessibility buttons.
     Category/Blend screens have a real in-flow topbar instead and
     don't need (or want) extra top padding on top of that. */
  .screen-attract{ padding-top:4.4rem; }
  /* .tile-grid's own width:min(94vw,66vh,46rem) already shrinks it
     to fit a short landscape viewport — nothing to override here. */
  .card-grid{ max-width:64rem; margin:0 auto; }
  .attract-content{ flex-direction:row; gap:2.5rem; text-align:left; max-width:60rem; }
  .attract-content .cta-begin{ margin-top:0; }
  .wordmark{ width:min(42vw,26rem); }
}

/* small-height safety (landscape on the 8.7in tablet is short) */
@media (max-height:420px){
  .screen-attract{ padding-top:3.6rem; }
  .badge{ width:4.6rem; height:4.6rem; }
  .tile .badge{ width:6rem; height:6rem; }
  .wordmark{ width:min(52vw,22rem); }
  .range-card{ min-height:0; }
}

/* focus visibility for external keyboards / accessibility inspection —
   covers the div[role="button"] range cards too, not just <button> */
button:focus-visible,
[role="button"]:focus-visible,
input:focus-visible{ outline:3px solid var(--gold-400); outline-offset:2px; }
.range-card:focus-visible{ outline-offset:0.15rem; }

/* ===== reduced motion (MASTER §4/§8) =====
   Drop the decorative, non-essential motion — screen fade, snowfall,
   the Attract CTA shimmer, the search-result highlight pulse — and
   render every screen in its final state immediately. The short
   (<=180ms) :active press-feedback transitions are deliberately kept:
   they're functional tap feedback, which the design system asks for. */
@media (prefers-reduced-motion: reduce){
  .screen{ animation:none; opacity:1; transform:none; }
  .range-card, .blend-chip{ animation:none; opacity:1; transform:none; }
  .tile{ animation:none; opacity:1; }   /* keep the translate(-50%,-50%) centering */
  .snowfall{ display:none; }
  .cta-begin::after{ animation:none; opacity:0; }
}

::-webkit-scrollbar{ width:0.5rem; }
::-webkit-scrollbar-thumb{ background:rgba(248,242,226,0.3); border-radius:999px; }
</style>

   missing a value (shouldn't happen now that all five are filled in,

  if(!obj) return "";

}

  contrast:'<svg viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="2"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg>'
};
function ringClass(ring){
  if(ring==="red") return "badge-ring-red";
  if(ring==="green") return "badge-ring-green";
  if(ring==="white") return "badge-ring-white";
  if(ring==="blue") return "badge-ring-blue";
  return "";
}

/* ============================================================
   STATE + NAVIGATION
   One universal Back button walks a history stack, so search
   jumps, drill-down, and list<->detail all behave consistently.

   NAV_DEFAULTS (screen position) and PREF_DEFAULTS (language,
   text size, contrast) are reset separately on purpose: this is
   a shared walk-up kiosk, not a personal device. Stepping Back
   one screen must never touch a passenger's language/accessibility
   choice mid-browse — but returning Home (explicit, or the
   inactivity timeout) hands the kiosk to the *next* passenger,
   so it resets everything, language included, rather than
   leaving it "stuck" on whatever the last person picked. Nothing
   here is persisted to storage across a full app reload, for the
   same reason — a fresh app launch should always start in English. */
var NAV_DEFAULTS  = { screen:"attract", categoryId:null, rangeId:null, blendId:null, stockingsColor:"red" };
var PREF_DEFAULTS = { lang:"en", textsize:"normal", contrast:false };
var state = Object.assign({}, NAV_DEFAULTS, PREF_DEFAULTS);
var history_ = [];
var inactivityTimer = null;
var INACTIVITY_TIMEOUT_MS = 90000; /* provisional — PRD §11 leaves the exact idle timeout open; adjust once Ray confirms */

function snapshot(){
  return { screen:state.screen, categoryId:state.categoryId, rangeId:state.rangeId, blendId:state.blendId, stockingsColor:state.stockingsColor };
}
function go(patch, opts){
  opts = opts || {};
  if(opts.push !== false){ history_.push(snapshot()); }
  Object.assign(state, patch);
  render();
  resetInactivity();
}
function goBack(){
  var prev = history_.pop();
  if(!prev){ goHome(); return; }
  Object.assign(state, NAV_DEFAULTS, prev); /* nav position only — prefs untouched */
  render();
  resetInactivity();
}
function goHome(){
  history_ = [];
  Object.assign(state, NAV_DEFAULTS, PREF_DEFAULTS); /* full reset for the next passenger */
  applyPrefsToDom();
  render();
  resetInactivity();
}
function resetInactivity(){
  if(inactivityTimer) clearTimeout(inactivityTimer);
  if(state.screen === "attract") return;
  inactivityTimer = setTimeout(function(){
    announce("Returning to the start screen after a period of inactivity.");
    goHome();
  }, INACTIVITY_TIMEOUT_MS);
}
function announce(msg){
  var el = document.getElementById("live-region");
  if(el) el.textContent = msg;
}

function applyPrefsToDom(){
  document.documentElement.dataset.textsize = state.textsize;
  document.documentElement.dataset.contrast = state.contrast ? "high" : "normal";
  document.documentElement.lang = state.lang;
}
function cycleTextSize(){
  var order = ["normal","large","xlarge"];
  var i = (order.indexOf(state.textsize)+1) % order.length;
  state.textsize = order[i];
  applyPrefsToDom();
  render();
}
function toggleContrast(){
  state.contrast = !state.contrast;
  applyPrefsToDom();
  render();
}
function setLang(code){
  var entry = LANGS.filter(function(l){ return l.code===code; })[0];
  if(!entry) return;
  if(!entry.ready){
    announce(entry.label + " " + t("comingSoon") + ".");
    return;
  }
  state.lang = code;
  applyPrefsToDom();
  render();
}

/* ============================================================
   SEARCH
   ============================================================ */
var searchOpen = false;
function openSearch(){ searchOpen = true; render(); requestAnimationFrame(function(){ var i=document.getElementById("search-input"); if(i) i.focus(); }); }
function closeSearch(){ searchOpen = false; render(); }
/* Matches against every language's name, not just the active one —
   a passenger might type in whatever language they know a flavour
   by, regardless of which language the kiosk is currently showing. */
function nameMatches(nameObj, q, qRaw){
  return Object.keys(nameObj).some(function(code){
    var v = nameObj[code];
    return v && v.toLowerCase().indexOf(q)>-1 || v===qRaw;
  });
}
function runSearch(qRaw){
  var q = (qRaw||"").trim().toLowerCase();
  if(!q) return [];
  var results = [];
  Object.keys(BLENDS).forEach(function(id){
    var b = BLENDS[id];
    if(nameMatches(b.name, q, qRaw.trim())){
      results.push({ type:"blend", id:id, label:blendName(b), sub:brewLabel(b) });
    }
  });
  RANGES.forEach(function(r){
    if(nameMatches(r.name, q, qRaw.trim()) || (r.style && r.style.toLowerCase().indexOf(q)>-1)){
      results.push({ type:"range", id:r.id, label:rangeName(r), sub:r.style });
    }
  });
  return results.slice(0,20);
}
function selectSearchResult(item){
  closeSearch();
  if(item.type==="blend"){
    go({ screen:"blend", rangeId:null, blendId:item.id });
  } else {
    go({ screen:"category", categoryId:RANGE_BY_ID[item.id].category, highlightRangeId:item.id });
    setTimeout(function(){
      var el = document.querySelector('[data-range-id="'+item.id+'"]');
      if(el){
        var smooth = !(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
        el.scrollIntoView({block:"center", behavior: smooth ? "smooth" : "auto"});
        el.classList.add("highlight"); setTimeout(function(){ el.classList.remove("highlight"); },2200);
      }
    },50);
  }
}

/* ============================================================
   RENDER
   ============================================================ */
var app = document.getElementById("app");

function render(){
  applyPrefsToDom();
  var html = "";
  if(state.screen==="attract"){
    html = renderAttract();
  } else {
    /* Wrapped in the same .screen flex column renderAttract() uses
       for itself, so `.screen-scroll{flex:1 1 auto}` inside it has
       an actual flex parent to grow into — without this wrapper it
       was just sizing to its own content and leaving the rest of
       the tall tablet viewport as dead space below it. */
    var body = renderTopbar();
    body += state.screen==="category" ? renderCategoryScreen() : renderBlendScreen();
    html = '<section class="screen">'+body+'</section>';
  }
  html += renderSearchOverlay();
  app.innerHTML = html;
  wireGlobalControls();
}

/* SVG flake (not the ❄ glyph, which renders as a colour emoji where an
   emoji font is installed — MASTER §9). Sizes off the span's font-size
   via 1em; colour inherits .snowflake { color: var(--cream-050) }. */
var SNOWFLAKE_SVG = '<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 2v20M3.3 7l17.4 10M3.3 17 20.7 7M12 5 9.5 7.5M12 5l2.5 2.5M12 19l-2.5-2.5M12 19l2.5-2.5M4.7 8.8 5.8 12l-3.2 1M19.3 15.2 18.2 12l3.2-1M4.7 15.2 5.8 12l-3.2-1M19.3 8.8 18.2 12l3.2 1"/></svg>';
function renderSnow(){
  var flakes = "";
  for(var i=0;i<22;i++){
    var left = (Math.random()*100).toFixed(1);
    var dur = (9 + Math.random()*9).toFixed(1);
    var delay = (Math.random()*12).toFixed(1);
    var size = (0.5 + Math.random()*0.9).toFixed(2);
    var drift = (Math.random()*6-3).toFixed(1);
    flakes += '<span class="snowflake" style="left:'+left+'%;font-size:'+size+'rem;--drift:'+drift+'rem;animation-duration:'+dur+'s;animation-delay:-'+delay+'s;">'+SNOWFLAKE_SVG+'</span>';
  }
  return '<div class="snowfall" aria-hidden="true">'+flakes+'</div>';
}

function renderAttract(){
  return ''+
  '<section class="screen screen-attract" data-action="begin">'+
    renderSnow()+
    '<div class="attract-glow" aria-hidden="true"></div>'+
    '<div class="attract-lang">'+ renderLangSwitch() +'</div>'+
    '<div class="attract-a11y">'+ renderA11yButtons() +'</div>'+
    '<div class="attract-content">'+
      '<div>'+
        '<div class="wordmark" role="img" aria-label="Sip The Season">'+ART.wordmark+'</div>'+
        '<p class="tagline">'+t("tagline")+'</p>'+
      '</div>'+
      '<button class="cta-begin" data-action="begin">'+t("tapBegin")+'</button>'+
    '</div>'+
  '</section>';
}

function renderTopbar(){
  var title = "";
  if(state.screen==="category" && state.categoryId){
    title = categoryName(CATEGORIES.filter(function(c){return c.id===state.categoryId;})[0]);
  } else if(state.screen==="blend"){
    if(state.blendId) title = blendName(BLENDS[state.blendId]);
    else if(state.rangeId) title = rangeName(RANGE_BY_ID[state.rangeId]);
  } else if(state.screen==="category"){
    title = t("chooseCategory");
  }
  return ''+
  '<header class="topbar">'+
    (history_.length ? '<button class="icon-btn back-btn" data-action="back" aria-label="'+t("back")+'">'+UI_ICONS.back+'<span>'+t("back")+'</span></button>' : '<span style="width:0.2rem"></span>')+
    '<div class="spacer topbar-title">'+escapeHtml(title)+'</div>'+
    '<div class="topbar-controls">'+
      '<button class="icon-btn" data-action="open-search" aria-label="'+t("search")+'">'+UI_ICONS.search+'</button>'+
      renderLangSwitch()+
      renderA11yButtons()+
    '</div>'+
  '</header>';
}

function renderA11yButtons(){
  return ''+
    '<button class="icon-btn" data-action="cycle-textsize" aria-label="'+t("textSize")+'">Aa</button>'+
    '<button class="icon-btn" data-action="toggle-contrast" aria-pressed="'+state.contrast+'" aria-label="'+t("contrast")+'">'+UI_ICONS.contrast+'</button>';
}

function renderLangSwitch(){
  var current = LANGS.filter(function(l){return l.code===state.lang;})[0];
  var items = LANGS.map(function(l){
    return '<button role="menuitemradio" aria-current="'+(l.code===state.lang)+'" aria-disabled="'+(!l.ready)+'" data-action="'+(l.ready?'set-lang':'lang-soon')+'" data-lang="'+l.code+'">'+
      '<span>'+l.label+'</span>'+ (l.ready? '' : '<span class="lang-soon">'+t("comingSoon")+'</span>') +
    '</button>';
  }).join("");
  return ''+
  '<div class="lang-switch">'+
    '<button class="icon-btn" data-action="toggle-lang-menu" aria-label="'+t("language")+'" aria-haspopup="true">'+UI_ICONS.globe+'<span>'+current.code.toUpperCase()+'</span></button>'+
    '<div class="lang-menu" role="menu" data-open="false">'+items+'</div>'+
  '</div>';
}

function renderCategoryScreen(){
  if(!state.categoryId){
    var tiles = CATEGORIES.map(function(c){
      return '<button class="tile" data-action="open-category" data-id="'+c.id+'">'+
        '<span class="badge">'+ART[c.id]+'</span>'+
        '<span class="tile-name">'+categoryName(c)+'</span>'+
        '<span class="tile-blurb">'+categoryBlurb(c)+'</span>'+
      '</button>';
    }).join("");
    return ''+
    '<div class="section-heading"><h2>'+t("chooseCategory")+'</h2></div>'+
    '<div class="screen-scroll"><div class="tile-grid">'+tiles+'</div></div>';
  }
  var cat = CATEGORIES.filter(function(c){return c.id===state.categoryId;})[0];
  var ranges = RANGES.filter(function(r){return r.category===state.categoryId;});
  var cards = ranges.map(renderRangeCard).join("");
  return ''+
  '<div class="section-heading"><h2>'+categoryName(cat)+'</h2></div>'+
  '<div class="screen-scroll"><div class="card-grid">'+cards+'</div></div>';
}

function renderRangeCard(r){
  /* A plain <div role="button"> on purpose, not a <button>: this
     card contains its own nested swatch <button>s for Stockings,
     and a <button> inside a <button> is invalid HTML — browsers
     silently close the outer button early, which was breaking the
     whole grid's layout. Enter/Space activation is wired manually
     below (see the keydown handler near the click delegation). */
  var ring = ringClass(r.ring);
  var swatches = "";
  if(r.variants){
    swatches = '<div class="swatch-row">'+ r.variants.map(function(v){
      var pressed = state.stockingsColor===v.id;
      return '<button class="swatch" aria-pressed="'+pressed+'" data-action="select-variant" data-range-id="'+r.id+'" data-variant="'+v.id+'">'+
        '<span class="swatch-dot" style="background:'+v.hex+'"></span>'+colorLabel(v.id)+
      '</button>';
    }).join("") + '</div>';
  }
  var rName = rangeName(r), rFmt = rangeFormat(r);
  var label = rName+(r.variants?(' — '+colorLabel(state.stockingsColor)):'')+', '+rFmt+', '+t("blendsInside")(r.blends.length);
  return ''+
  '<div class="range-card '+ring+'" role="button" tabindex="0" aria-label="'+escapeHtml(label)+'" data-action="open-range" data-id="'+r.id+'" data-range-id="'+r.id+'">'+
    '<span class="badge">'+ART[r.icon]+'</span>'+
    '<span class="range-body">'+
      '<span class="range-name">'+rName+(r.variants?(' — '+colorLabel(state.stockingsColor)):'')+'</span>'+
      '<span class="range-meta">'+rFmt+' · '+r.pack+' · '+t("blendsInside")(r.blends.length)+'</span>'+
      swatches+
    '</span>'+
  '</div>';
}

function renderBlendScreen(){
  if(state.blendId){
    return renderBlendDetail(state.blendId);
  }
  var range = RANGE_BY_ID[state.rangeId];
  if(!range){ return '<div class="screen-scroll"><p style="color:#fff">Range not found.</p></div>'; }
  var colourSuffix = range.variants ? (" — "+colorLabel(state.stockingsColor)+" "+t("colourway")) : "";
  var chips = range.blends.map(function(bid){
    var b = BLENDS[bid];
    var allergen = allergenLabel(b);
    return '<button class="blend-chip" data-action="open-blend" data-id="'+bid+'">'+
      '<span class="name-en">'+blendName(b)+'</span>'+
      '<span class="chip-meta"><span class="pill">'+brewLabel(b)+'</span>'+(allergen?'<span class="pill allergen">'+allergen+'</span>':'')+'</span>'+
    '</button>';
  }).join("");
  var variantRow = range.variants ? ('<div class="swatch-row" style="margin-bottom:0.6rem">'+ range.variants.map(function(v){
      var pressed = state.stockingsColor===v.id;
      return '<button class="swatch" aria-pressed="'+pressed+'" data-action="select-variant" data-range-id="'+range.id+'" data-variant="'+v.id+'">'+
        '<span class="swatch-dot" style="background:'+v.hex+'"></span>'+colorLabel(v.id)+
      '</button>';
    }).join("")+'</div>') : "";
  return ''+
  '<div class="blend-list-header">'+
    '<h2>'+rangeName(range)+colourSuffix+'</h2>'+
    '<div class="meta">'+rangeFormat(range)+' · '+range.pack+' · style '+range.style+'</div>'+
  '</div>'+
  '<div class="screen-scroll">'+variantRow+'<div class="blend-chip-grid">'+chips+'</div></div>';
}

function renderBlendDetail(bid){
  var b = BLENDS[bid];
  var ing = ingredientList(bid);
  var ingBlock = ing
    ? '<p class="ingredients-body">'+escapeHtml(ing)+'</p>'
    : '<div class="pending">'+t("pendingIngredients")+'</div>';
  return ''+
  '<div class="screen-scroll">'+
    '<div class="detail-card">'+
      '<div class="detail-media">'+ICONS.photo+'<span>'+t("pendingImage")+'</span></div>'+
      '<h2 class="detail-title-en">'+blendName(b)+'</h2>'+
      '<dl>'+
        '<div class="detail-row"><dt>'+t("brewTime")+'</dt><dd>'+brewLabel(b)+'</dd></div>'+
        '<div class="detail-row"><dt>'+t("allergenInfo")+'</dt><dd>'+(allergenLabel(b) || "—")+'</dd></div>'+
        '<div class="detail-row"><dt>'+t("price")+'</dt><dd>'+t("pendingPrice")+'</dd></div>'+
      '</dl>'+
      '<div class="detail-block"><h3>'+t("tastingNotes")+'</h3><div class="pending">'+t("pendingCopy")+'</div></div>'+
      '<div class="detail-block"><h3>'+t("ingredients")+'</h3>'+ingBlock+'</div>'+
      '<div class="detail-block"><h3>'+t("cupColour")+'</h3><div class="pending">'+ICONS.cup.replace(/#f8f2e2/g,"#6b5560")+t("pendingCup")+'</div></div>'+
      '<div class="allergen-note staff-note">'+t("askStaff")+'</div>'+
    '</div>'+
  '</div>';
}

function renderSearchOverlay(){
  if(!searchOpen) return "";
  return ''+
  '<div class="search-overlay" data-open="true" role="dialog" aria-label="'+t("search")+'">'+
    '<div class="search-panel">'+
      '<div class="search-input-row">'+
        '<input id="search-input" type="text" inputmode="search" placeholder="'+t("searchPlaceholder")+'" autocomplete="off" />'+
        '<button class="icon-btn" data-action="close-search" aria-label="Close">'+UI_ICONS.close+'</button>'+
      '</div>'+
      '<div class="search-hint">'+t("searchHint")+'</div>'+
      '<div class="search-results" id="search-results"></div>'+
    '</div>'+
  '</div>';
}

function renderSearchResults(items){
  var box = document.getElementById("search-results");
  if(!box) return;
  if(!items.length){
    box.innerHTML = '<div class="search-hint">'+t("noResults")+'</div>';
    return;
  }
  box.innerHTML = items.map(function(it,idx){
    return '<button class="search-result" data-action="pick-result" data-index="'+idx+'">'+
      '<div class="sr-type">'+(it.type==="blend"?t("blendResult"):t("rangeResult"))+'</div>'+
      '<div>'+escapeHtml(it.label)+(it.sub?' <span style="opacity:.6">· '+escapeHtml(it.sub)+'</span>':'')+'</div>'+
    '</button>';
  }).join("");
  box.__items = items;
}

/* ---------- helpers ---------- */
function escapeHtml(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]; }); }

/* ============================================================
   EVENT WIRING (delegated)
   ============================================================ */
function wireGlobalControls(){
  var input = document.getElementById("search-input");
  if(input){
    input.addEventListener("input", function(){ renderSearchResults(runSearch(input.value)); });
  }
}

app.addEventListener("click", function(e){
  /* An open language menu (or the search overlay) eats the very next
     tap to close itself — it must not ALSO fall through to whatever
     data-action sits underneath (e.g. the attract screen's whole-
     screen "tap anywhere to begin", which would otherwise both close
     the menu and silently start the app on the same tap). */
  var openMenu = document.querySelector('.lang-menu[data-open="true"]');
  if(openMenu && !e.target.closest(".lang-switch")){
    openMenu.setAttribute("data-open","false");
    e.stopPropagation();
    return;
  }
  if(e.target.classList.contains("search-overlay")){
    closeSearch();
    return;
  }

  var el = e.target.closest("[data-action]");
  if(!el) return;
  var action = el.getAttribute("data-action");
  resetInactivity();

  switch(action){
    case "begin":
      go({ screen:"category" });
      break;
    case "back":
      goBack();
      break;
    case "open-category":
      go({ screen:"category", categoryId: el.getAttribute("data-id") });
      break;
    case "open-range": {
      var rid = el.getAttribute("data-id");
      go({ screen:"blend", rangeId: rid, blendId:null });
      break;
    }
    case "open-blend":
      go({ screen:"blend", blendId: el.getAttribute("data-id") });
      break;
    case "select-variant":
      state.stockingsColor = el.getAttribute("data-variant");
      e.stopPropagation();
      render();
      break;
    case "open-search":
      openSearch();
      break;
    case "close-search":
      closeSearch();
      break;
    case "pick-result": {
      var box = document.getElementById("search-results");
      var idx = parseInt(el.getAttribute("data-index"),10);
      var item = box && box.__items && box.__items[idx];
      if(item) selectSearchResult(item);
      break;
    }
    case "toggle-lang-menu": {
      var menu = el.parentElement.querySelector(".lang-menu");
      var isOpen = menu.getAttribute("data-open") === "true";
      document.querySelectorAll(".lang-menu").forEach(function(m){ m.setAttribute("data-open","false"); });
      menu.setAttribute("data-open", String(!isOpen));
      e.stopPropagation();
      break;
    }
    case "set-lang":
      setLang(el.getAttribute("data-lang"));
      break;
    case "lang-soon":
      announce(el.textContent.trim() + " is not available yet.");
      break;
    case "cycle-textsize":
      cycleTextSize();
      break;
    case "toggle-contrast":
      toggleContrast();
      break;
  }
});

/* Enter/Space activates the div[role="button"] range cards the same
   way a native <button> already handles those keys for free — see
   the comment in renderRangeCard() for why they can't be real
   <button> elements. Re-dispatching a click lets the one switch-case
   above stay the single source of truth for what each action does. */
app.addEventListener("keydown", function(e){
  if(e.key !== "Enter" && e.key !== " " && e.key !== "Spacebar") return;
  var el = e.target.closest('[role="button"][data-action]');
  if(!el) return;
  e.preventDefault();
  el.click();
});

/* Escape backs out of search or the current screen */
document.addEventListener("keydown", function(e){
  if(e.key === "Escape"){
    if(searchOpen) closeSearch();
    else if(history_.length) goBack();
  }
});
["pointerdown","keydown"].forEach(function(evt){
  document.addEventListener(evt, resetInactivity, {passive:true});
});

/* ---------- init ---------- */
applyPrefsToDom();
render();

})();
</script>
</body>
</html>
